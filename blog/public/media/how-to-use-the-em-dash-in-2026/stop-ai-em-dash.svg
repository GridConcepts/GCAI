<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">How to stop ChatGPT, Claude, Gemini and Copilot using the em dash</title><desc id="d">ChatGPT: Custom Instructions in Personalisation settings. Claude: per-project instructions, not global. Gemini: saved instructions or a first message. Copilot: no universal setting; custom instructions in Pages or workspaces, otherwise state it each chat.</desc><rect width="900" height="450" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Can you stop each AI from using the em dash?</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Where to set the rule, and how well it holds</text><text x="40" y="116" font-size="11" fill="#657067" font-weight="600" text-anchor="start" letter-spacing="1.5">ASSISTANT</text><text x="180" y="116" font-size="11" fill="#657067" font-weight="600" text-anchor="start" letter-spacing="1.5">STOPPABLE?</text><text x="300" y="116" font-size="11" fill="#657067" font-weight="600" text-anchor="start" letter-spacing="1.5">WHERE TO SET THE RULE</text><text x="600" y="116" font-size="11" fill="#657067" font-weight="600" text-anchor="start" letter-spacing="1.5">HOW WELL IT HOLDS</text><line x1="40" y1="128" x2="860" y2="128" stroke="#d8ded0"/><text x="40" y="168" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">ChatGPT</text><rect x="172" y="148" width="100" height="28" fill="#f1f5e2" stroke="#92ad39"/><text x="222" y="167" font-size="12.5" fill="#1d2720" font-weight="600" text-anchor="middle">Yes</text><text x="300" y="160" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Settings, Personalisation, Custom</text><text x="300" y="176" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Instructions</text><text x="600" y="160" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Works for new chats, not</text><text x="600" y="176" font-size="12" fill="#657067" font-weight="400" text-anchor="start">guaranteed 100%</text><line x1="40" y1="198" x2="860" y2="198" stroke="#d8ded0"/><text x="40" y="238" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Claude</text><rect x="172" y="218" width="100" height="28" fill="#f1f5e2" stroke="#92ad39"/><text x="222" y="237" font-size="12.5" fill="#1d2720" font-weight="600" text-anchor="middle">Per project</text><text x="300" y="230" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Add the rule to each Project's</text><text x="300" y="246" font-size="12" fill="#657067" font-weight="400" text-anchor="start">instructions</text><text x="600" y="230" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Works. Not available</text><text x="600" y="246" font-size="12" fill="#657067" font-weight="400" text-anchor="start">globally</text><line x1="40" y1="268" x2="860" y2="268" stroke="#d8ded0"/><text x="40" y="308" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Gemini</text><rect x="172" y="288" width="100" height="28" fill="#f1f5e2" stroke="#92ad39"/><text x="222" y="307" font-size="12.5" fill="#1d2720" font-weight="600" text-anchor="middle">Yes</text><text x="300" y="300" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Saved instructions, or paste as the</text><text x="300" y="316" font-size="12" fill="#657067" font-weight="400" text-anchor="start">first message</text><text x="600" y="300" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Usually holds; may need a</text><text x="600" y="316" font-size="12" fill="#657067" font-weight="400" text-anchor="start">reminder or two</text><line x1="40" y1="338" x2="860" y2="338" stroke="#d8ded0"/><text x="40" y="378" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Copilot</text><rect x="172" y="358" width="100" height="28" fill="#faf3ea" stroke="#c8a27a"/><text x="222" y="377" font-size="12.5" fill="#1d2720" font-weight="600" text-anchor="middle">Partly</text><text x="300" y="370" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Custom instructions in Pages or a</text><text x="300" y="386" font-size="12" fill="#657067" font-weight="400" text-anchor="start">workspace, else each new chat</text><text x="600" y="370" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Holds in a conversation, may</text><text x="600" y="386" font-size="12" fill="#657067" font-weight="400" text-anchor="start">slip back</text><line x1="40" y1="408" x2="860" y2="408" stroke="#d8ded0"/><text x="40" y="432" font-size="12" fill="#1d2720" font-weight="600" text-anchor="start">Rule to paste: use only the en dash in every response and never use the em dash.</text></svg>