<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI detector test results after removing em dashes</title><desc id="d">Removing every em dash from a human-written article did not reliably pass five AI detectors: some still failed, some scores rose. Roughly half of best-performing client articles fail AI detection, and Google says AI detection is not a ranking factor.</desc><rect width="900" height="440" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Does stripping em dashes make text pass as human?</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Grid Concepts re-test, 2026: a fully human-written article, every em dash removed, five widely used AI detectors</text><rect x="40" y="116" width="196" height="230" fill="#faf3ea" stroke="#c8a27a"/><text x="56" y="156" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Still failed</text><text x="56" y="192" font-size="12" fill="#657067" font-weight="400" text-anchor="start">In some cases the text</text><text x="56" y="209" font-size="12" fill="#657067" font-weight="400" text-anchor="start">still failed the detector.</text><rect x="247" y="116" width="196" height="230" fill="#faf3ea" stroke="#c8a27a"/><text x="263" y="156" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Score went up</text><text x="263" y="192" font-size="12" fill="#657067" font-weight="400" text-anchor="start">In others, removing em</text><text x="263" y="209" font-size="12" fill="#657067" font-weight="400" text-anchor="start">dashes pushed the</text><text x="263" y="226" font-size="12" fill="#657067" font-weight="400" text-anchor="start">AI-generated score higher.</text><rect x="454" y="116" width="196" height="230" fill="#f1f5e2" stroke="#92ad39"/><text x="470" y="156" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">About half</text><text x="470" y="192" font-size="12" fill="#657067" font-weight="400" text-anchor="start">of our clients'</text><text x="470" y="209" font-size="12" fill="#657067" font-weight="400" text-anchor="start">best-performing articles</text><text x="470" y="226" font-size="12" fill="#657067" font-weight="400" text-anchor="start">fail AI detection,</text><text x="470" y="243" font-size="12" fill="#657067" font-weight="400" text-anchor="start">including pieces written</text><text x="470" y="260" font-size="12" fill="#657067" font-weight="400" text-anchor="start">years before generative</text><text x="470" y="277" font-size="12" fill="#657067" font-weight="400" text-anchor="start">AI.</text><rect x="661" y="116" width="196" height="230" fill="#f1f5e2" stroke="#92ad39"/><text x="677" y="156" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Not a ranking</text><text x="677" y="184" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">factor</text><text x="677" y="220" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Google has stated publicly</text><text x="677" y="237" font-size="12" fill="#657067" font-weight="400" text-anchor="start">that AI detection is not a</text><text x="677" y="254" font-size="12" fill="#657067" font-weight="400" text-anchor="start">ranking factor.</text><text x="40" y="384" font-size="14" fill="#1d2720" font-weight="600" text-anchor="start">Tight, well-structured writing simply reads as machine-like to these tools.</text><text x="40" y="408" font-size="13" fill="#657067" font-weight="400" text-anchor="start">A dash swap is not a humanising strategy.</text></svg>