<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Hyphen, en dash and em dash compared</title><desc id="d">A hyphen joins words, an en dash is twice as long and marks ranges, and an em dash is four times as long as a hyphen. Top-ranking marketing blogs in 2026 use very few em dashes.</desc><rect width="900" height="400" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Hyphen, en dash, em dash: three different marks</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Drawn to relative length (hyphen 1, en dash 2, em dash 4)</text><rect x="40" y="120" width="820" height="70" fill="#fff" stroke="#d8ded0"/><text x="60" y="150" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Hyphen</text><text x="60" y="172" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Joins words: well-known, 100-day</text><rect x="600" y="152" width="40" height="6" fill="#657067"/><rect x="40" y="204" width="820" height="70" fill="#fff" stroke="#92ad39"/><text x="60" y="234" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">En dash</text><text x="60" y="256" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Ranges and, on the modern web, the stand-in for a dash: 2025 to 2026</text><rect x="600" y="236" width="80" height="6" fill="#92ad39"/><rect x="40" y="288" width="820" height="70" fill="#fff" stroke="#d8ded0"/><text x="60" y="318" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Em dash</text><text x="60" y="340" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">The long dash. Chicago style sets it with no spaces. Now an AI tell.</text><rect x="600" y="320" width="160" height="6" fill="#c8a27a"/><text x="40" y="382" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Current web norm for top-ranking marketing blogs: very few em dashes, with the shorter en dash where a dash is needed.</text></svg>