<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Decision guide: replace em dashes or leave them</title><desc id="d">If you are building a new site, redesigning, or creating a standalone landing page, swap em dashes for en dashes. Otherwise leave existing pages alone.</desc><rect width="900" height="430" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Should you replace em dashes on your site?</text><rect x="300" y="96" width="300" height="56" fill="#1d2720"/><text x="450" y="130" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Is the site already changing?</text><path d="M300 124 H190 V186" fill="none" stroke="#c8a27a" stroke-width="2"/><text x="236" y="116" font-size="11" fill="#9a7442" font-weight="700" text-anchor="start" letter-spacing="1">NO</text><rect x="40" y="186" width="300" height="190" fill="#faf3ea" stroke="#c8a27a"/><text x="60" y="218" font-size="18" fill="#1d2720" font-weight="700" text-anchor="start" font-family="Lora, Georgia, serif">Leave it alone</text><text x="60" y="246" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Hundreds of older pages already use em</text><text x="60" y="264" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">dashes. The em dash is not a problem</text><text x="60" y="282" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">worth solving retrospectively, and a</text><text x="60" y="300" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">patchwork would look worse.</text><path d="M600 124 H710 V186" fill="none" stroke="#92ad39" stroke-width="2"/><text x="642" y="116" font-size="11" fill="#53661c" font-weight="700" text-anchor="start" letter-spacing="1">YES</text><rect x="560" y="186" width="300" height="190" fill="#f1f5e2" stroke="#92ad39"/><text x="580" y="218" font-size="18" fill="#1d2720" font-weight="700" text-anchor="start" font-family="Lora, Georgia, serif">Swap em dash for en dash</text><text x="580" y="248" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">+ Building a brand-new website</text><text x="580" y="284" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">+ Redesigning the current site</text><text x="580" y="320" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">+ Creating a standalone landing page,</text><text x="580" y="336" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">  such as for a Google Ads campaign</text><text x="40" y="408" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Either way: for AI-generated copy, put the rule in your prompt.</text></svg>