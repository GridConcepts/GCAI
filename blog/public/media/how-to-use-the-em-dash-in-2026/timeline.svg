<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Timeline of the web's fights with dashes</title><desc id="d">In the 2000s the short dash became a marker of cheap web copy. From 2023 to 2025 ChatGPT overused the em dash, making it an AI tell. OpenAI fixed it in 2025. In 2026 the web steers clear of it.</desc><rect width="900" height="400" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">The web's second fight with dashes</text><line x1="70" y1="150" x2="685" y2="150" stroke="#92ad39" stroke-width="3"/><circle cx="70" cy="150" r="9" fill="#92ad39" stroke="#fff" stroke-width="3"/><text x="70" y="118" font-size="15" fill="#53661c" font-weight="700" text-anchor="start" font-family="Lora, Georgia, serif">2000s</text><rect x="40" y="176" width="196" height="190" fill="#fff" stroke="#d8ded0"/><text x="54" y="204" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">Short dash = cheap copy</text><text x="54" y="230" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Word defaulted to the</text><text x="54" y="247" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">shorter dash where</text><text x="54" y="264" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">typography called for the</text><text x="54" y="281" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">long one. Editors and</text><text x="54" y="298" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">designers learned to wince.</text><circle cx="275" cy="150" r="9" fill="#92ad39" stroke="#fff" stroke-width="3"/><text x="275" y="118" font-size="15" fill="#53661c" font-weight="700" text-anchor="start" font-family="Lora, Georgia, serif">2023-2025</text><rect x="245" y="176" width="196" height="190" fill="#fff" stroke="#d8ded0"/><text x="259" y="204" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">The em dash becomes an AI</text><text x="259" y="222" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">tell</text><text x="259" y="248" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">ChatGPT output was littered</text><text x="259" y="265" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">with em dashes. Users could</text><text x="259" y="282" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">not make the model stop.</text><circle cx="480" cy="150" r="9" fill="#92ad39" stroke="#fff" stroke-width="3"/><text x="480" y="118" font-size="15" fill="#53661c" font-weight="700" text-anchor="start" font-family="Lora, Georgia, serif">2025</text><rect x="450" y="176" width="196" height="190" fill="#fff" stroke="#d8ded0"/><text x="464" y="204" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">OpenAI fixes it</text><text x="464" y="230" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Sam Altman thought the fix</text><text x="464" y="247" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">worth a dedicated post on</text><text x="464" y="264" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">X.</text><circle cx="685" cy="150" r="9" fill="#92ad39" stroke="#fff" stroke-width="3"/><text x="685" y="118" font-size="15" fill="#53661c" font-weight="700" text-anchor="start" font-family="Lora, Georgia, serif">2026</text><rect x="655" y="176" width="196" height="190" fill="#fff" stroke="#d8ded0"/><text x="669" y="204" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">Web steers clear</text><text x="669" y="230" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">ChatGPT now generates</text><text x="669" y="247" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">noticeably fewer em dashes.</text><text x="669" y="264" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Copywriters are briefed to</text><text x="669" y="281" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">keep them to a minimum.</text></svg>