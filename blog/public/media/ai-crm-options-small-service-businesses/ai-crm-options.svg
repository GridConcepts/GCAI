<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI CRM options compared</title><desc id="d">HubSpot and Zoho CRM connect to Xero and MYOB with AI drafting and lead scoring on paid tiers, suiting everything in one place. Pipedrive has a visual pipeline suiting a handful of active jobs. Trade-specific job tools sometimes include basic AI follow-ups as standard.</desc><rect width="900" height="360" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Where the well-known options sit</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">A starting shape, not an endorsement</text><rect x="40" y="100" width="820" height="34" fill="#1d2720" stroke="#1d2720" stroke-width="1"/><text x="52" y="122" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">OPTION</text><text x="202" y="122" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">WHAT IT OFFERS</text><text x="562" y="122" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">SUITS</text><rect x="40" y="134" width="820" height="52" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="154.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">HubSpot</text><text x="202" y="154.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Connects to Xero and MYOB; AI drafting and lead</text><text x="202" y="170.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">scoring on paid tiers</text><text x="562" y="154.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Everything in one place: quoting,</text><text x="562" y="170.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">invoicing, follow-ups</text><rect x="40" y="186" width="820" height="52" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="52" y="206.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Zoho CRM</text><text x="202" y="206.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Connects to Xero and MYOB; AI drafting and lead</text><text x="202" y="222.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">scoring on paid tiers</text><text x="562" y="206.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Everything in one place: quoting,</text><text x="562" y="222.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">invoicing, follow-ups</text><rect x="40" y="238" width="820" height="52" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="258.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Pipedrive</text><text x="202" y="258.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Visual pipeline with an assistant that nudges</text><text x="202" y="274.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">on stalled deals</text><text x="562" y="258.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">A handful of active jobs, not many small</text><text x="562" y="274.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">enquiries</text><rect x="40" y="290" width="820" height="52" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="52" y="310.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Trade job tools</text><text x="202" y="310.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Basic AI follow-ups sometimes included as</text><text x="202" y="326.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">standard</text><text x="562" y="310.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Quoting and scheduling are the bigger</text><text x="562" y="326.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">pain point</text></svg>