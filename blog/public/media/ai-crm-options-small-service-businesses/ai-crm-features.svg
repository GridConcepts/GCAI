<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI CRM features that matter</title><desc id="d">Four AI CRM features that matter: automatic follow-up reminders, drafting rather than deciding, lead sorting that matches how you work, and data entry done for you. One widely cited figure puts lost inbound leads at around 18%.</desc><rect width="900" height="390" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Four AI features worth paying for</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Each one stops a lead going cold or a job being missed</text><rect x="40.0" y="100" width="196.0" height="195" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="56.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Automatic follow-up</text><text x="56.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">reminders</text><text x="56.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Flags a quote quiet for</text><text x="56.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">five days, or a client</text><text x="56.0" y="242.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">due a call back</text><rect x="248.0" y="100" width="196.0" height="195" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="248.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="264.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="264.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Drafting, not</text><text x="264.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">deciding</text><text x="264.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Writes a first draft for</text><text x="264.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">you to check and send</text><rect x="456.0" y="100" width="196.0" height="195" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="456.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="472.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="472.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Lead sorting that</text><text x="472.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">fits you</text><text x="472.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Flags urgent jobs like a</text><text x="472.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">burst pipe, not</text><text x="472.0" y="242.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">unexplained scores</text><rect x="664.0" y="100" width="196.0" height="195" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="664.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="680.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="680.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Data entry it does</text><text x="680.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">for you</text><text x="680.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Pulls details from an</text><text x="680.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">email or call transcript</text><text x="680.0" y="242.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">into the record</text><rect x="40" y="315" width="820" height="50" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="58" y="345" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Around 18% of inbound leads are lost to follow-ups that never happened (widely cited industry figure).</text></svg>