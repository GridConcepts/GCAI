<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Why the switch goes wrong before the AI even runs</title><desc id="d">Client records split across an old spreadsheet, a paper diary and a previous office manager's preferred system feed into a new AI CRM. If migration skips half of this, the AI feature has nothing to flag, because leads can sit under three different spellings of the same client's name.</desc><rect width="900" height="440" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Why the switch goes wrong before the AI even runs</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Scattered records break AI features before they start</text><rect x="40" y="100" width="260" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="132" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Old spreadsheet</text><text x="56" y="152" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Historic client list, rarely opened</text><rect x="40" y="190" width="260" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="222" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Paper diary</text><text x="56" y="242" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Appointments and quotes, on paper</text><rect x="40" y="280" width="260" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="312" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Last manager's system</text><text x="56" y="332" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Whatever they preferred to use</text><line x1="300" y1="135" x2="408" y2="135" stroke="#92ad39" stroke-width="2"/><path d="M408 135 L401.7 138.0 M408 135 L401.7 132.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="225" x2="408" y2="225" stroke="#92ad39" stroke-width="2"/><path d="M408 225 L401.7 228.0 M408 225 L401.7 222.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="315" x2="408" y2="315" stroke="#92ad39" stroke-width="2"/><path d="M408 315 L401.7 318.0 M408 315 L401.7 312.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="420" y="100" width="300" height="250" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="420" y="100" width="300" height="5" fill="#92ad39"/><text x="440" y="200" font-size="18" fill="#1d2720" font-weight="700" text-anchor="start">New AI CRM</text><text x="440" y="224" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Should hold every client,</text><text x="440" y="242" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">quote and job in one place</text><line x1="570" y1="350" x2="570" y2="374" stroke="#92ad39" stroke-width="2"/><path d="M570 374 L567 367 M570 374 L573 367" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="40" y="374" width="820" height="46" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="58" y="402" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">If migration skips half of this, the AI feature has nothing to flag: leads can sit under three spellings of one name.</text></svg>
