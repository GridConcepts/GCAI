<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">FAQ sections versus competitive density</title><desc id="d">Two comparable local clients had the same strong Google Maps reviews and top 10 service page rankings. The client without an FAQ section, in a niche with only a handful of competitors, got picked up in AI Overviews. The client with an FAQ section, in a niche with hundreds of competitors, did not.</desc><rect width="900" height="310" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Same reviews and rankings, different outcome</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Two comparable local clients, August 2025 to 2026</text><rect x="40" y="104" width="390" height="180" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="66" y="134" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Client A: no FAQ section</text><text x="66" y="164" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Google Maps reviews: strong</text><text x="66" y="184" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Service pages: ranking top 10</text><text x="66" y="204" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Competitors in niche: a handful</text><text x="66" y="224" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">FAQ section: none</text><text x="66" y="256" font-size="16" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Picked up in AI Overviews</text><rect x="470" y="104" width="390" height="180" fill="#faf3ea" stroke="#c8a27a" stroke-width="1"/><text x="496" y="134" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Client B: has FAQ section</text><text x="496" y="164" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Google Maps reviews: strong</text><text x="496" y="184" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Service pages: ranking top 10</text><text x="496" y="204" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Competitors in niche: hundreds</text><text x="496" y="224" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">FAQ section: yes</text><text x="496" y="256" font-size="16" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Not picked up</text></svg>