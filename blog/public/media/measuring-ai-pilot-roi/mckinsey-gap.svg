<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">The gap between AI use and measurable return</title><desc id="d">McKinsey found 88% of organisations use AI in at least one function, 39% can point to measurable EBIT impact, and 6% are high performers attributing 5% or more of EBIT to AI.</desc><rect width="900" height="340" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Using AI vs showing a return</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Source: McKinsey global survey, as cited in the post</text><text x="40" y="122" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Organisations using AI in at least one function</text><text x="860" y="124" font-size="16" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">88%</text><rect x="40" y="132" width="820" height="14" fill="#e9ede0"/><rect x="40" y="132" width="721.6" height="14" fill="#c8a27a"/><text x="40" y="184" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Can point to measurable EBIT impact</text><text x="860" y="186" font-size="16" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">39%</text><rect x="40" y="194" width="820" height="14" fill="#e9ede0"/><rect x="40" y="194" width="319.8" height="14" fill="#92ad39"/><text x="40" y="246" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">High performers: 5% or more of EBIT from AI</text><text x="860" y="248" font-size="16" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">6%</text><rect x="40" y="256" width="820" height="14" fill="#e9ede0"/><rect x="40" y="256" width="49.2" height="14" fill="#53661c"/></svg>