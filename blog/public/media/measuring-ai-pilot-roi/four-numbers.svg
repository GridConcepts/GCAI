<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Four metrics that survive board scrutiny</title><desc id="d">Four metrics agreed before a pilot starts: a dollar number, a baseline, a payback period and a risk indicator. They feed a four-line board report: baseline, result, dollar value, and the ask to scale, adjust or stop.</desc><rect width="900" height="440" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Four numbers that survive a board</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Agreed before the pilot starts</text><rect x="40.0" y="110" width="196.75" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="110" width="196.75" height="5" fill="#92ad39"/><text x="56.0" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">A dollar number</text><text x="56.0" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Cost avoided or revenue</text><text x="56.0" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">protected, net of run</text><text x="56.0" y="232.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">costs.</text><rect x="247.75" y="110" width="196.75" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="247.75" y="110" width="196.75" height="5" fill="#92ad39"/><text x="263.75" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="263.75" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">A baseline</text><text x="263.75" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Measured for a few weeks</text><text x="263.75" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">before launch.</text><rect x="455.5" y="110" width="196.75" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="455.5" y="110" width="196.75" height="5" fill="#92ad39"/><text x="471.5" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="471.5" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">A payback period</text><text x="471.5" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Months until net benefit</text><text x="471.5" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">covers the cost.</text><rect x="663.25" y="110" width="196.75" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="663.25" y="110" width="196.75" height="5" fill="#92ad39"/><text x="679.25" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="679.25" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">A risk indicator</text><text x="679.25" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Error, rework or audit</text><text x="679.25" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">exceptions.</text><rect x="40.0" y="330" width="179.5" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="129.75" y="356" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Baseline</text><text x="129.75" y="372" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">before</text><line x1="225.5" y1="365.0" x2="247.5" y2="365.0" stroke="#92ad39" stroke-width="2"/><path d="M247.5 365.0 L241.2 368.0 M247.5 365.0 L241.2 362.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="253.5" y="330" width="179.5" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="343.25" y="356" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Result</text><text x="343.25" y="372" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">after</text><line x1="439.0" y1="365.0" x2="461.0" y2="365.0" stroke="#92ad39" stroke-width="2"/><path d="M461.0 365.0 L454.7 368.0 M461.0 365.0 L454.7 362.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="467.0" y="330" width="179.5" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="556.75" y="356" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Worth in dollars</text><line x1="652.5" y1="365.0" x2="674.5" y2="365.0" stroke="#92ad39" stroke-width="2"/><path d="M674.5 365.0 L668.2 368.0 M674.5 365.0 L668.2 362.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="680.5" y="330" width="179.5" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="770.25" y="356" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Ask: scale, adjust</text><text x="770.25" y="372" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">or stop</text></svg>