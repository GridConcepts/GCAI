<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Three reasons enquiries go cold</title><desc id="d">Three common gaps cause slow lead response: nobody watches the inbox after hours, enquiries land across fragmented channels, and following up takes more effort than a quick reply.</desc><rect width="900" height="300" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Why the delay happens</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Three gaps, not a lack of effort</text><rect x="40" y="104" width="260" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40" y="104" width="260" height="5" fill="#c8a27a"/><text x="56" y="140" font-size="26" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56" y="168" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">After-hours blind spot</text><text x="56" y="192" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">A form submitted at 7pm sits</text><text x="56" y="208.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">until someone opens their</text><text x="56" y="224.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">laptop the next morning</text><rect x="320" y="104" width="260" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="320" y="104" width="260" height="5" fill="#c8a27a"/><text x="336" y="140" font-size="26" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="336" y="168" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Fragmented channels</text><text x="336" y="192" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">A web form, a Facebook</text><text x="336" y="208.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">message, a voicemail - nothing</text><text x="336" y="224.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">lands in one place</text><rect x="600" y="104" width="260" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="600" y="104" width="260" height="5" fill="#c8a27a"/><text x="616" y="140" font-size="26" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="616" y="168" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Slow to reply</text><text x="616" y="192" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Replying means finding the</text><text x="616" y="208.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">enquiry, checking the job,</text><text x="616" y="224.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">then writing from scratch</text></svg>