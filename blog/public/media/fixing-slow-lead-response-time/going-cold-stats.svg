<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Cost of slow lead response</title><desc id="d">Leads contacted within five minutes show a 21 times qualification difference versus 30 minutes; callbacks within 60 seconds converted about four times better; 34 percent of Australian organisations did not answer an email enquiry and only 21 percent of those that did replied within 24 hours.</desc><rect width="900" height="290" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">What going cold costs</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Figures cited in the post</text><rect x="40" y="104" width="190" height="124" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="56" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">21x</text><text x="56" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">qualification gap:</text><text x="56" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">contacted within 5</text><text x="56" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">minutes vs 30</text><rect x="250" y="104" width="190" height="124" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="266" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">~4x</text><text x="266" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">conversion: called back</text><text x="266" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">within 60 seconds vs</text><text x="266" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">after 30 minutes</text><rect x="460" y="104" width="190" height="124" fill="#faf3ea" stroke="#c8a27a" stroke-width="1"/><text x="476" y="156" font-size="34" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">34%</text><text x="476" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of leading Australian</text><text x="476" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">organisations never</text><text x="476" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">answered an email</text><rect x="670" y="104" width="190" height="124" fill="#faf3ea" stroke="#c8a27a" stroke-width="1"/><text x="686" y="156" font-size="34" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">21%</text><text x="686" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of those that replied</text><text x="686" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">managed it within 24</text><text x="686" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">hours</text><text x="40" y="264" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Sources as cited in the post: widely cited 5 vs 30 minute analysis, a first-touch response study, an Australian organisations survey.</text></svg>