<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 306" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Three steps to fix slow lead response</title><desc id="d">Three numbered steps: get every enquiry into one place, send an instant acknowledgement, and flag urgent enquiries so a human follows up fast.</desc><rect width="900" height="306" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Fixing it without overbuilding</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Three small things, in order</text><rect x="40.0" y="104" width="262.6666666666667" height="170" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="56.0" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="170.0" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">One place for every</text><text x="56.0" y="189.5" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">enquiry</text><text x="56.0" y="215.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Forms, email and other channels</text><text x="56.0" y="231.8" font-size="12" fill="#657067" font-weight="400" text-anchor="start">land where you check constantly.</text><rect x="318.6666666666667" y="104" width="262.6666666666667" height="170" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="318.6666666666667" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="334.6666666666667" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="334.6666666666667" y="170.0" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Instant acknowledgement</text><text x="334.6666666666667" y="195.5" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Confirm it arrived and a real</text><text x="334.6666666666667" y="212.3" font-size="12" fill="#657067" font-weight="400" text-anchor="start">person will follow up, with a</text><text x="334.6666666666667" y="229.1" font-size="12" fill="#657067" font-weight="400" text-anchor="start">rough timeframe.</text><rect x="597.3333333333334" y="104" width="262.6666666666667" height="170" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="597.3333333333334" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="613.3333333333334" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="613.3333333333334" y="170.0" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Flag the urgent ones</text><text x="613.3333333333334" y="195.5" font-size="12" fill="#657067" font-weight="400" text-anchor="start">A human follows up fast on the few</text><text x="613.3333333333334" y="212.3" font-size="12" fill="#657067" font-weight="400" text-anchor="start">that cannot wait.</text></svg>