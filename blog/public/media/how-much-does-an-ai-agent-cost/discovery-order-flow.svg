<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Where discovery work should sit in the process</title>
  <desc id="d">Two flow diagrams comparing an open-ended day-rate path, where discovery happens after signing and the bill grows as problems surface, against a fixed-quote path, where discovery happens before a number is given and the setup and monthly cost are fixed.</desc>
  <rect width="900" height="340" fill="#f9faf5" stroke="#d8ded0"/>

  <text x="30" y="40" font-family="Lora, Georgia, serif" font-weight="600" font-size="22" fill="#1d2720">Discovery before the number, not after</text>
  <text x="30" y="62" font-size="13" fill="#657067">The order of operations is what makes a quote fixed or open-ended</text>

  <!-- Row 1: risky path -->
  <text x="30" y="100" font-size="13" font-weight="600" fill="#1d2720">Open-ended day rate</text>

  <rect x="30" y="112" width="190" height="60" fill="#faf3ea" stroke="#c8a27a" stroke-dasharray="4 3"/>
  <text x="125" y="138" text-anchor="middle" font-size="13" fill="#1d2720">Sign agreement</text>
  <text x="125" y="156" text-anchor="middle" font-size="13" fill="#1d2720">with no fixed scope</text>

  <line x1="220" y1="142" x2="268" y2="142" stroke="#92ad39" stroke-width="2"/>
  <path d="M268 142 L258 137 L258 147 Z" fill="#92ad39"/>

  <rect x="270" y="112" width="190" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
  <text x="365" y="138" text-anchor="middle" font-size="13" fill="#1d2720">Problems found</text>
  <text x="365" y="156" text-anchor="middle" font-size="13" fill="#1d2720">mid-project</text>

  <line x1="460" y1="142" x2="508" y2="142" stroke="#92ad39" stroke-width="2"/>
  <path d="M508 142 L498 137 L498 147 Z" fill="#92ad39"/>

  <rect x="510" y="112" width="360" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
  <text x="690" y="138" text-anchor="middle" font-size="13" fill="#1d2720">Bill keeps growing on an</text>
  <text x="690" y="156" text-anchor="middle" font-size="13" fill="#1d2720">hourly rate with no ceiling</text>

  <!-- Row 2: fixed quote path -->
  <text x="30" y="222" font-size="13" font-weight="600" fill="#1d2720">Fixed quote</text>

  <rect x="30" y="234" width="190" height="60" fill="#faf3ea" stroke="#c8a27a" stroke-dasharray="4 3"/>
  <text x="125" y="260" text-anchor="middle" font-size="13" fill="#1d2720">Discovery happens</text>
  <text x="125" y="278" text-anchor="middle" font-size="13" fill="#1d2720">before a number is given</text>

  <line x1="220" y1="264" x2="268" y2="264" stroke="#92ad39" stroke-width="2"/>
  <path d="M268 264 L258 259 L258 269 Z" fill="#92ad39"/>

  <rect x="270" y="234" width="190" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
  <text x="365" y="260" text-anchor="middle" font-size="13" fill="#1d2720">Fixed setup cost</text>
  <text x="365" y="278" text-anchor="middle" font-size="13" fill="#1d2720">quoted against findings</text>

  <line x1="460" y1="264" x2="508" y2="264" stroke="#92ad39" stroke-width="2"/>
  <path d="M508 264 L498 259 L498 269 Z" fill="#92ad39"/>

  <rect x="510" y="234" width="360" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
  <text x="690" y="260" text-anchor="middle" font-size="13" fill="#1d2720">Fixed monthly running cost,</text>
  <text x="690" y="278" text-anchor="middle" font-size="13" fill="#1d2720">agreed before you sign</text>
</svg>
