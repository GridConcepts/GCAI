<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Three drivers of AI agent price</title><desc id="d">Three cards: how much the agent has to connect to, how much judgement it needs, and whether it is off-the-shelf or built for you.</desc><rect width="900" height="280" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Why the price swings so much</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Three things drive it more than anything else</text><rect x="40.0" y="104" width="262.6666666666667" height="150" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="56.0" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">What it connects to</text><text x="56.0" y="194.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Website content only is cheap.</text><text x="56.0" y="211.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">CRM, scheduling and accounting</text><text x="56.0" y="227.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">links add work.</text><rect x="318.6666666666667" y="104" width="262.6666666666667" height="150" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="318.6666666666667" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="334.6666666666667" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="334.6666666666667" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">How much judgement</text><text x="334.6666666666667" y="194.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Opening hours is easy. Judging</text><text x="334.6666666666667" y="211.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">urgency takes more setup and</text><text x="334.6666666666667" y="227.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">testing.</text><rect x="597.3333333333334" y="104" width="262.6666666666667" height="150" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="597.3333333333334" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="613.3333333333334" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="613.3333333333334" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Off-the-shelf or built</text><text x="613.3333333333334" y="194.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">A widget you configure is a</text><text x="613.3333333333334" y="211.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">subscription. A custom build is a</text><text x="613.3333333333334" y="227.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">project.</text></svg>