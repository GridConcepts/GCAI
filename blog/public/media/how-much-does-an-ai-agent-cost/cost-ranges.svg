<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Realistic AI agent cost ranges</title><desc id="d">Table of ranges: off-the-shelf chat tools roughly 0 to 150 dollars a month; a configured one-job tool in the low thousands to set up plus a monthly fee; a custom workflow build as a multi-thousand-dollar project; running costs of a couple of hundred to a couple of thousand dollars a month.</desc><rect width="900" height="404" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Realistic ranges for a small business</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">A starting shape, not a quote</text><rect x="40" y="104" width="820" height="34" fill="#1d2720" stroke="#1d2720" stroke-width="1"/><text x="52" y="126" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">OPTION</text><text x="322" y="126" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">TYPICAL COST</text><text x="612" y="126" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">NOTES</text><rect x="40" y="138" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="158.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Off-the-shelf chat or FAQ tool</text><text x="322" y="158.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Roughly $0-$150 a month</text><text x="612" y="158.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">You set it up yourself with</text><text x="612" y="174.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">templates</text><rect x="40" y="192" width="820" height="54" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="52" y="212.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Configured tool for one job</text><text x="322" y="212.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Low thousands to set up, plus a</text><text x="322" y="228.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">monthly fee</text><text x="612" y="212.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">After-hours enquiries or quote</text><text x="612" y="228.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">triage</text><rect x="40" y="246" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="266.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Custom workflow build</text><text x="322" y="266.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Multi-thousand-dollar project</text><text x="612" y="266.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Priced against the specific</text><text x="612" y="282.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">tasks, not a flat rate</text><rect x="40" y="300" width="820" height="54" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="52" y="320.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Ongoing running costs</text><text x="322" y="320.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">A couple of hundred to a couple of</text><text x="322" y="336.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">thousand a month</text><text x="612" y="320.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Hosting, support and AI usage</text><text x="40" y="382" font-size="12.5" fill="#53661c" font-weight="600" text-anchor="start">Treat these with scepticism until someone has looked at your systems.</text></svg>