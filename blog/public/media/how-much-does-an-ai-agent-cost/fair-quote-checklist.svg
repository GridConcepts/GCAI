<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Fair quote checklist</title><desc id="d">Four things a fair AI agent quote should name: the exact task, what it connects to, a fixed setup and monthly cost, and what you get if you stop paying.</desc><rect width="900" height="316" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">What a fair quote names</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Expect an agency to be able to state all four</text><rect x="40.0" y="104" width="196.75" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="104" width="196.75" height="5" fill="#92ad39"/><text x="56.0" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Exact task</text><text x="56.0" y="194.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">For example, drafting a</text><text x="56.0" y="210.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">quote reply within a set</text><text x="56.0" y="226.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">time</text><rect x="247.75" y="104" width="196.75" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="247.75" y="104" width="196.75" height="5" fill="#92ad39"/><text x="263.75" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="263.75" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Connections</text><text x="263.75" y="194.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">What it connects to, and</text><text x="263.75" y="210.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">what happens if one</text><text x="263.75" y="226.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">breaks</text><rect x="455.5" y="104" width="196.75" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="455.5" y="104" width="196.75" height="5" fill="#92ad39"/><text x="471.5" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="471.5" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Fixed pricing</text><text x="471.5" y="194.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Fixed setup and monthly</text><text x="471.5" y="210.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">cost, not an open-ended</text><text x="471.5" y="226.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">day rate</text><rect x="663.25" y="104" width="196.75" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="663.25" y="104" width="196.75" height="5" fill="#92ad39"/><text x="679.25" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="679.25" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Exit option</text><text x="679.25" y="194.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">What you get if you stop</text><text x="679.25" y="210.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">paying and run it</text><text x="679.25" y="226.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">yourself</text></svg>