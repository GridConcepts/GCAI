<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">The five checks in a data quality audit</title><desc id="d">Five numbered checks: completeness, consistency, duplication, freshness, and lineage and access, each scored against the few fields the AI use case depends on.</desc><rect width="900" height="330" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">The five checks in a data quality audit</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Score each against the two or three fields your use case depends on</text><rect x="40.0" y="110" width="155.2" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="110" width="155.2" height="5" fill="#92ad39"/><text x="56.0" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Completeness</text><text x="56.0" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Share of records</text><text x="56.0" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">with required</text><text x="56.0" y="232.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">fields filled in</text><rect x="206.2" y="110" width="155.2" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="206.2" y="110" width="155.2" height="5" fill="#92ad39"/><text x="222.2" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="222.2" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Consistency</text><text x="222.2" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Same thing recorded</text><text x="222.2" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">the same way across</text><text x="222.2" y="232.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">systems</text><rect x="372.4" y="110" width="155.2" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="372.4" y="110" width="155.2" height="5" fill="#92ad39"/><text x="388.4" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="388.4" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Duplication</text><text x="388.4" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Records for the</text><text x="388.4" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">same person, matter</text><text x="388.4" y="232.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">or asset more than</text><text x="388.4" y="248.5" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">once</text><rect x="538.5999999999999" y="110" width="155.2" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="538.5999999999999" y="110" width="155.2" height="5" fill="#92ad39"/><text x="554.5999999999999" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="554.5999999999999" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Freshness</text><text x="554.5999999999999" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">When each field was</text><text x="554.5999999999999" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">last updated vs how</text><text x="554.5999999999999" y="232.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">current it must be</text><rect x="704.8" y="110" width="155.2" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="704.8" y="110" width="155.2" height="5" fill="#92ad39"/><text x="720.8" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">5</text><text x="720.8" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Lineage and</text><text x="720.8" y="194.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">access</text><text x="720.8" y="218.4" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Where a field</text><text x="720.8" y="234.5" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">originates, who</text><text x="720.8" y="250.6" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">edits it,</text><text x="720.8" y="266.7" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">governance sign-off</text></svg>