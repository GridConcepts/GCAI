<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 264" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Why the data audit comes first</title><desc id="d">Three stat tiles: 60% of AI projects not supported by AI-ready data will be abandoned through 2026; 63% of over 1,200 data leaders lack the right data practices or are unsure; 90% or higher is a reasonable starting completeness threshold.</desc><rect width="900" height="264" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Why the data audit comes first</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Gartner, February 2025, survey of over 1,200 data management leaders</text><rect x="40" y="110" width="260" height="124" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="56" y="162" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">60%</text><text x="56" y="186.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of AI projects without AI-ready</text><text x="56" y="202.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">data abandoned through 2026</text><text x="56" y="218.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">(Gartner)</text><rect x="320" y="110" width="260" height="124" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="336" y="162" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">63%</text><text x="336" y="186.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of leaders lack the right data</text><text x="336" y="202.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">practices for AI or are not sure</text><text x="336" y="218.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">they have them</text><rect x="600" y="110" width="260" height="124" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="616" y="162" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">90%+</text><text x="616" y="186.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">a reasonable starting completeness</text><text x="616" y="202.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">threshold for mandatory fields</text></svg>