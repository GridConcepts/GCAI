<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Shortcut or sequence: two paths to the same AI agent</title><desc id="d">Jumping straight to agents skips clarity and connection, so the information layer is rediscovered as not ready, at higher cost, later. Following the clarity, connection, practice sequence builds guardrails and training first, producing one AI use case that holds up.</desc><rect width="900" height="400" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Shortcut or sequence: two paths to the same agent</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Tools are the easy part. Sequence is the hard part.</text><text x="40" y="100" font-size="12" fill="#1d2720" font-weight="700" text-anchor="start" letter-spacing="1">THE SHORTCUT</text><text x="480" y="100" font-size="12" fill="#1d2720" font-weight="700" text-anchor="start" letter-spacing="1">THE SEQUENCE</text><rect x="40" y="110" width="380" height="70" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="56" y="140" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Jump straight to agents</text><text x="56" y="160" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Skip clarity and connection</text><line x1="230" y1="180" x2="230" y2="210" stroke="#92ad39" stroke-width="2"/><path d="M230 210 L227 203 M230 210 L233 203" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="40" y="210" width="380" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="240" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">The information layer was never ready</text><text x="56" y="260" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Job history, pricing or contacts scattered</text><line x1="230" y1="280" x2="230" y2="310" stroke="#92ad39" stroke-width="2"/><path d="M230 310 L227 303 M230 310 L233 303" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="40" y="310" width="380" height="70" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="56" y="340" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Rediscovered later, at higher cost</text><text x="56" y="360" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Rework after the agent is already live</text><rect x="480" y="110" width="380" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="496" y="140" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Clarity, then connection, then practice</text><text x="496" y="160" font-size="12" fill="#657067" font-weight="400" text-anchor="start">The 100-day order, followed in sequence</text><line x1="670" y1="180" x2="670" y2="210" stroke="#92ad39" stroke-width="2"/><path d="M670 210 L667 203 M670 210 L673 203" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="480" y="210" width="380" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="496" y="240" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Guardrails and training already in place</text><text x="496" y="260" font-size="12" fill="#657067" font-weight="400" text-anchor="start">People know how and when to use it</text><line x1="670" y1="280" x2="670" y2="310" stroke="#92ad39" stroke-width="2"/><path d="M670 310 L667 303 M670 310 L673 303" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="480" y="310" width="380" height="70" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="496" y="340" font-size="14" fill="#53661c" font-weight="700" text-anchor="start">One AI use case that actually holds up</text><text x="496" y="360" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Reviewed, kept, and built on</text></svg>
