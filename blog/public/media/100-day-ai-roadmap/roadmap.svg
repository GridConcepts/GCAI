<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">A 100-day roadmap to AI readiness</title><desc id="d">Three phases: days 1 to 30 clarity, days 31 to 60 connection, days 61 to 100 practice, each with four actions from readiness check through to one AI use case with guardrails and training.</desc><rect width="900" height="395" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">A 100-day roadmap to AI readiness</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Clarity, then connection, then practice</text><rect x="40.0" y="100" width="262.6666666666667" height="270" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="100" width="262.6666666666667" height="5" fill="#92ad39"/><text x="56.0" y="138" font-size="24" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Days 1-30</text><text x="56.0" y="160" font-size="12" fill="#1d2720" font-weight="700" text-anchor="start" letter-spacing="1">CLARITY</text><circle cx="60.0" cy="184" r="3" fill="#92ad39"/><text x="72.0" y="188" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Readiness check across data,</text><text x="72.0" y="204" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">systems, governance, people</text><circle cx="60.0" cy="226" r="3" fill="#92ad39"/><text x="72.0" y="230" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Name workflows where AI cuts</text><text x="72.0" y="246" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">rework or delay</text><circle cx="60.0" cy="268" r="3" fill="#92ad39"/><text x="72.0" y="272" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Identify the data those</text><text x="72.0" y="288" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">workflows depend on</text><circle cx="60.0" cy="310" r="3" fill="#92ad39"/><text x="72.0" y="314" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Agree who owns quality of</text><text x="72.0" y="330" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">critical fields</text><line x1="304.6666666666667" y1="235" x2="316.6666666666667" y2="235" stroke="#92ad39" stroke-width="2"/><path d="M316.6666666666667 235 L310.4 238.0 M316.6666666666667 235 L310.4 232.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="318.6666666666667" y="100" width="262.6666666666667" height="270" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="318.6666666666667" y="100" width="262.6666666666667" height="5" fill="#92ad39"/><text x="334.6666666666667" y="138" font-size="24" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Days 31-60</text><text x="334.6666666666667" y="160" font-size="12" fill="#1d2720" font-weight="700" text-anchor="start" letter-spacing="1">CONNECTION</text><circle cx="338.6666666666667" cy="184" r="3" fill="#92ad39"/><text x="350.6666666666667" y="188" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Map the systems that touch the</text><text x="350.6666666666667" y="204" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">chosen workflows</text><circle cx="338.6666666666667" cy="226" r="3" fill="#92ad39"/><text x="350.6666666666667" y="230" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Close the highest-friction</text><text x="350.6666666666667" y="246" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">handoffs first</text><circle cx="338.6666666666667" cy="268" r="3" fill="#92ad39"/><text x="350.6666666666667" y="272" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Reduce duplicates and</text><text x="350.6666666666667" y="288" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">conflicting sources of truth</text><circle cx="338.6666666666667" cy="310" r="3" fill="#92ad39"/><text x="350.6666666666667" y="314" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Set up a lightweight reporting</text><text x="350.6666666666667" y="330" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">view</text><line x1="583.3333333333334" y1="235" x2="595.3333333333334" y2="235" stroke="#92ad39" stroke-width="2"/><path d="M595.3333333333334 235 L589.0 238.0 M595.3333333333334 235 L589.0 232.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="597.3333333333334" y="100" width="262.6666666666667" height="270" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><rect x="597.3333333333334" y="100" width="262.6666666666667" height="5" fill="#92ad39"/><text x="613.3333333333334" y="138" font-size="24" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Days 61-100</text><text x="613.3333333333334" y="160" font-size="12" fill="#1d2720" font-weight="700" text-anchor="start" letter-spacing="1">PRACTICE</text><circle cx="617.3333333333334" cy="184" r="3" fill="#92ad39"/><text x="629.3333333333334" y="188" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">One AI use case with a clear</text><text x="629.3333333333334" y="204" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">owner and metric</text><circle cx="617.3333333333334" cy="226" r="3" fill="#92ad39"/><text x="629.3333333333334" y="230" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Basic access and usage</text><text x="629.3333333333334" y="246" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">guardrails</text><circle cx="617.3333333333334" cy="268" r="3" fill="#92ad39"/><text x="629.3333333333334" y="272" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Train the people who use the</text><text x="629.3333333333334" y="288" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">workflow weekly</text><circle cx="617.3333333333334" cy="310" r="3" fill="#92ad39"/><text x="629.3333333333334" y="314" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Review evidence, keep what</text><text x="629.3333333333334" y="330" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">works, stop what does not</text></svg>