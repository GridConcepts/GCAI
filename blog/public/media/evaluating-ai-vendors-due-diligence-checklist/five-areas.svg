<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Five due-diligence areas for AI vendors</title><desc id="d">Five areas to score before signing with an AI vendor: data handling and privacy, model behaviour and change control, security and subprocessors, commercial terms and exit, and accountability.</desc><rect width="900" height="430" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Five areas to score before you sign</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Score against the specific use case you are buying for</text><rect x="40" y="105" width="820" height="34" fill="#1d2720" stroke="#1d2720" stroke-width="1"/><text x="52" y="127" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">AREA</text><text x="302" y="127" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">WHAT TO ASK</text><rect x="40" y="139" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="159.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Data handling and privacy</text><text x="302" y="159.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Is our data used to train the model? Can we opt out in writing? Where is it</text><text x="302" y="175.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">processed?</text><rect x="40" y="193" width="820" height="54" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="52" y="213.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Model behaviour and change</text><text x="52" y="229.25" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">control</text><text x="302" y="213.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">How often does the model change, and are we notified first?</text><rect x="40" y="247" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="267.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Security and subprocessors</text><text x="302" y="267.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Who else touches our data? Ask for the full chain.</text><rect x="40" y="301" width="820" height="54" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="52" y="321.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Commercial terms and exit</text><text x="302" y="321.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Can we get our data out in a usable format if we leave?</text><rect x="40" y="355" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="375.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">Accountability</text><text x="302" y="375.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">If the tool gets it wrong, who is liable? Silence is the answer.</text></svg>