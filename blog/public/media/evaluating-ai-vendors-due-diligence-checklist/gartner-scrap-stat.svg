<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Why due diligence matters now</title><desc id="d">Gartner forecasts more than 40% of agentic AI projects will be scrapped before the end of 2027, due to unclear business value and inadequate risk controls rather than bad models.</desc><rect width="900" height="260" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Why due diligence matters now</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Gartner forecast cited in this post</text><rect x="40" y="104" width="260" height="124" fill="#faf3ea" stroke="#c8a27a" stroke-width="1"/><text x="56" y="156" font-size="34" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">40%+</text><text x="56" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of agentic AI projects will</text><text x="56" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">be scrapped before the end</text><text x="56" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of 2027 (Gartner)</text><text x="330" y="130" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Not mainly a story about bad models</text><text x="330" y="156" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">It's unclear business value and inadequate risk controls, not a bad</text><text x="330" y="172.25" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">model - the gaps a standard SaaS checklist was never built to catch.</text><text x="330" y="188.5" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">They surface six months in, not during the demo.</text></svg>