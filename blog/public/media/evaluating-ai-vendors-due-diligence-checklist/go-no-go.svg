<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">From checklist to go/no-go decision</title><desc id="d">Set the pass threshold first, score the five areas for the data the tool touches, decide which are non-negotiable and which can carry a documented risk acceptance, then make a go or no-go decision.</desc><rect width="900" height="250" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Turning the checklist into a go/no-go</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Decide the bar before you see any vendor's answers</text><rect x="40.0" y="110" width="179.5" height="90" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="129.75" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Set the pass</text><text x="129.75" y="152" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">threshold</text><text x="129.75" y="168" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">Before seeing answers</text><line x1="225.5" y1="155.0" x2="247.5" y2="155.0" stroke="#92ad39" stroke-width="2"/><path d="M247.5 155.0 L241.2 158.0 M247.5 155.0 L241.2 152.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="253.5" y="110" width="179.5" height="90" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="343.25" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Score the five areas</text><text x="343.25" y="152" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">For the data it touches</text><line x1="439.0" y1="155.0" x2="461.0" y2="155.0" stroke="#92ad39" stroke-width="2"/><path d="M461.0 155.0 L454.7 158.0 M461.0 155.0 L454.7 152.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="467.0" y="110" width="179.5" height="90" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="556.75" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Split the areas</text><text x="556.75" y="152" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">Non-negotiable or risk</text><text x="556.75" y="166" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">accepted</text><line x1="652.5" y1="155.0" x2="674.5" y2="155.0" stroke="#92ad39" stroke-width="2"/><path d="M674.5 155.0 L668.2 158.0 M674.5 155.0 L668.2 152.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="680.5" y="110" width="179.5" height="90" fill="#92ad39" stroke="#92ad39" stroke-width="1"/><text x="770.25" y="136" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Go or no-go</text><text x="770.25" y="152" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">Defensible to a board</text></svg>