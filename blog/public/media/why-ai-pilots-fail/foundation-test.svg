<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Treat the first AI initiative as a foundation test</title><desc id="d">Five steps: choose one workflow with a clear owner, write down the metric that would change, confirm the data and systems that feed it, decide what safe to use means, and time-box the work and review the evidence.</desc><rect width="900" height="310" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Treat the first AI initiative as a foundation test</text><rect x="40.0" y="90" width="155.2" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="90" width="155.2" height="5" fill="#92ad39"/><text x="56.0" y="128" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Pick one</text><text x="56.0" y="174.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">workflow</text><text x="56.0" y="198.4" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Choose one workflow</text><text x="56.0" y="214.5" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">with a clear owner</text><rect x="206.2" y="90" width="155.2" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="206.2" y="90" width="155.2" height="5" fill="#92ad39"/><text x="222.2" y="128" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="222.2" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Write the</text><text x="222.2" y="174.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">metric</text><text x="222.2" y="198.4" font-size="1