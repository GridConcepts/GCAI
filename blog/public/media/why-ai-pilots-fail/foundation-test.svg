or the</text><text x="554.5999999999999" y="230.6" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">team</text><rect x="704.8" y="90" width="155.2" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="704.8" y="90" width="155.2" height="5" fill="#92ad39"/><text x="720.8" y="128" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">5</text><text x="720.8" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Time-box it</text><text x="720.8" y="180.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Time-box the work</text><text x="720.8" y="196.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">and review the</text><text x="720.8" y="212.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">evidence</text></svg>