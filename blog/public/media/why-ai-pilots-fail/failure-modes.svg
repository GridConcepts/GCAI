<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Three ways AI pilots fail to show financial benefit</title><desc id="d">Three failure modes: no measurable outcome, foundations too thin because customer data is fragmented, and no path from sandbox experiment to day-to-day practice.</desc><rect width="900" height="310" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Three ways AI pilots fail to show financial benefit</text><rect x="40.0" y="90" width="262.6666666666667" height="190" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><rect x="40.0" y="90" width="262.6666666666667" height="5" fill="#c8a27a"/><text x="56.0" y="128" font-size="26" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">No measurable outcome</text><text x="56.0" y="180.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">No before-and-after means no proof</text><text x="56.0" y="197.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">of value. People liked it is not a</text><text x="56.0" y="213.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">financial result.</text><rect x="318.6666666666667" y="90" width="262.6666666666667" height="190" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><rect x="318.6666666666667" y="90" width="262.6666666666667" height="5" fill="#c8a27a"/><text x="334.6666666666667" y="128" font-size="26" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="334.6666666666667" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Foundations too thin</text><text x="334.6666666666667" y="180.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Fragmented customer data means the</text><text x="334.6666666666667" y="197.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">pilot spends its energy on</text><text x="334.6666666666667" y="213.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">workarounds. The tool gets blamed</text><text x="334.6666666666667" y="230.59999999999997" font-size="12" fill="#657067" font-weight="400" text-anchor="start">for a systems problem.</text><rect x="597.3333333333334" y="90" width="262.6666666666667" height="190" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><rect x="597.3333333333334" y="90" width="262.6666666666667" height="5" fill="#c8a27a"/><text x="613.3333333333334" y="128" font-size="26" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="613.3333333333334" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">No path to practice</text><text x="613.3333333333334" y="180.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Pilots die between sandbox and</text><text x="613.3333333333334" y="197.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">daily operations. Training,</text><text x="613.3333333333334" y="213.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">access, governance and process</text><text x="613.3333333333334" y="230.59999999999997" font-size="12" fill="#657067" font-weight="400" text-anchor="start">design are not optional.</text></svg>