<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 314" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Reminding versus resolving unpaid invoices</title><desc id="d">Two columns. Reminding, which AI can do: scheduled reminders on day 1, 7 and 14 overdue, flagging invoices early, matching payments. Resolving, which needs a human: payment plan calls, relationship decisions, handing bad debt to collections.</desc><rect width="900" height="314" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Two jobs hiding inside chasing invoices</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">AI handles the reminding; resolving still needs you</text><rect x="40" y="104" width="402" height="180" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="56" y="134" font-size="13" fill="#53661c" font-weight="700" text-anchor="start" letter-spacing="1">REMINDING: AI CAN DO IT</text><text x="76" y="166" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Reminders by email or SMS on day 1, 7 and 14</text><text x="76" y="182" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">overdue</text><circle cx="62" cy="162" r="4" fill="#92ad39"/><text x="76" y="212" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Flag invoices before they go bad</text><circle cx="62" cy="208" r="4" fill="#92ad39"/><text x="76" y="242" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Match payments to invoices, including part</text><text x="76" y="258" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">payments</text><circle cx="62" cy="238" r="4" fill="#92ad39"/><rect x="458" y="104" width="402" height="180" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="474" y="134" font-size="13" fill="#9a7442" font-weight="700" text-anchor="start" letter-spacing="1">RESOLVING: NEEDS A HUMAN</text><text x="494" y="166" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Phone call to a good client who needs a payment</text><text x="494" y="182" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">plan</text><circle cx="480" cy="162" r="4" fill="#c8a27a"/><text x="494" y="212" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Chase a big client harder, or hold off for the</text><text x="494" y="228" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">relationship</text><circle cx="480" cy="208" r="4" fill="#c8a27a"/><text x="494" y="258" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Hand a genuinely bad debt to a collections agency</text><circle cx="480" cy="254" r="4" fill="#c8a27a"/></svg>