<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 244" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Late invoice payment statistics</title><desc id="d">Xero data: just over half of invoices Australian small businesses send are paid late, by an average of six to seven days, and the typical invoice takes over three weeks to be paid.</desc><rect width="900" height="244" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">How late do small business invoices run?</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Xero Small Business Insights, Australian small businesses</text><rect x="40" y="104" width="260" height="110" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="56" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Over half</text><text x="56" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of invoices sent are paid late</text><rect x="320" y="104" width="260" height="110" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="336" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">6-7 days</text><text x="336" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">average lateness past the due date</text><rect x="600" y="104" width="260" height="110" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="616" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3+ weeks</text><text x="616" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">typical time for an invoice to be</text><text x="616" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">paid in full</text></svg>