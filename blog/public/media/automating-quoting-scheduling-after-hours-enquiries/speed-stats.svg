<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Speed and response statistics</title><desc id="d">Four stat tiles: leads contacted within five minutes are 21 times more likely to be qualified than after 30 minutes; average first response took 42 hours; 23 percent of enquiries never answered; AI use among small businesses about 11 percent.</desc><rect width="900" height="290" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Why speed matters</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Figures cited in the post</text><rect x="40" y="104" width="190" height="124" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="56" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">21x</text><text x="56" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">more likely to be</text><text x="56" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">qualified if contacted</text><text x="56" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">in 5 minutes vs 30</text><rect x="250" y="104" width="190" height="124" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="266" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">42 hrs</text><text x="266" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">average first response</text><text x="266" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">time across 2,241</text><text x="266" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">companies</text><rect x="460" y="104" width="190" height="124" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="476" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">23%</text><text x="476" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of enquiries in that</text><text x="476" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">audit were never</text><text x="476" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">answered at all</text><rect x="670" y="104" width="190" height="124" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="686" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">11%</text><text x="686" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">AI use among small and</text><text x="686" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">micro businesses (ABS</text><text x="686" y="212.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">2024-25)</text><text x="40" y="264" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Sources: 2007 MIT/InsideSales.com study of 100,000+ call attempts; 2011 audit of 2,241 companies; ABS 2024-25.</text></svg>