<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 316" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Three tasks worth automating first</title><desc id="d">Three cards: after-hours enquiries, quoting and scheduling, the three tasks service businesses should automate first.</desc><rect width="900" height="316" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Three tasks worth automating first</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">The three things that actually eat a week</text><rect x="40.0" y="104" width="262.6666666666667" height="150" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="56.0" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">After-hours enquiries</text><text x="56.0" y="194.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Capture name, number and need at</text><text x="56.0" y="211.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">once, and reply within minutes.</text><rect x="318.6666666666667" y="104" width="262.6666666666667" height="150" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="318.6666666666667" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="334.6666666666667" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="334.6666666666667" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Quoting</text><text x="334.6666666666667" y="194.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Rates, job notes and a template</text><text x="334.6666666666667" y="211.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">become a draft you check and send.</text><rect x="597.3333333333334" y="104" width="262.6666666666667" height="150" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="597.3333333333334" y="104" width="262.6666666666667" height="5" fill="#92ad39"/><text x="613.3333333333334" y="142" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="613.3333333333334" y="170.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Scheduling</text><text x="613.3333333333334" y="194.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Slot jobs by availability, with</text><text x="613.3333333333334" y="211.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">confirmations and reminders sent</text><text x="613.3333333333334" y="227.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">for you.</text><text x="40" y="288" font-size="13" fill="#53661c" font-weight="600" text-anchor="start">You still set the price. The tool removes the retyping.</text></svg>