<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI pilot failure statistics</title><desc id="d">MIT Project NANDA found 95% of generative AI pilots show no measurable return on the P&amp;L, and industry tracking shows the share of enterprises abandoning most AI programs jumped from 17% to 42% in a single year.</desc><rect width="900" height="240" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Why pilots fail to reach production</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">The structure around the demo is the problem</text><rect x="40" y="100" width="402" height="110" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="152" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">95%</text><text x="56" y="176.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of generative AI pilots show no measurable return on the</text><text x="56" y="192.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">P&amp;L (MIT Project NANDA)</text><rect x="458" y="100" width="402" height="110" fill="#faf3ea" stroke="#c8a27a" stroke-width="1"/><text x="474" y="152" font-size="34" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">17% to 42%</text><text x="474" y="176.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">share of enterprises abandoning most AI programs, in a</text><text x="474" y="192.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">single year (industry tracking)</text></svg>