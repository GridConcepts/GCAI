<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI pilot success criteria</title><desc id="d">Before an AI pilot starts, settle one business metric, a baseline taken in advance, and a pre-agreed threshold such as a 15% improvement with no unresolved security or compliance flags. Keep the pilot to 60 to 90 days in one team.</desc><rect width="900" height="350" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Define success before you touch a tool</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Three things settled before the pilot starts</text><rect x="40.0" y="100" width="265.3333333333333" height="160" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="100" width="265.3333333333333" height="5" fill="#92ad39"/><text x="56.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">One business metric</text><text x="56.0" y="190.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Turnaround time, hours per matter</text><text x="56.0" y="207.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">or error rate, not 'efficiency'</text><rect x="317.3333333333333" y="100" width="265.3333333333333" height="160" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="317.3333333333333" y="100" width="265.3333333333333" height="5" fill="#92ad39"/><text x="333.3333333333333" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="333.3333333333333" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">A baseline</text><text x="333.3333333333333" y="190.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Taken before the pilot, so 'it</text><text x="333.3333333333333" y="207.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">feels faster' can be checked</text><rect x="594.6666666666666" y="100" width="265.3333333333333" height="160" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="594.6666666666666" y="100" width="265.3333333333333" height="5" fill="#92ad39"/><text x="610.6666666666666" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="610.6666666666666" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">A pre-agreed threshold</text><text x="610.6666666666666" y="190.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">For example 15% better than</text><text x="610.6666666666666" y="207.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">baseline with no unresolved</text><text x="610.6666666666666" y="223.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">security flags</text><rect x="40" y="280" width="820" height="46" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="58" y="308" font-size="12.5" fill="#1d2720" font-weight="600" text-anchor="start">Keep it short: 60 to 90 days in one team or practice group, not a firm-wide rollout.</text></svg>