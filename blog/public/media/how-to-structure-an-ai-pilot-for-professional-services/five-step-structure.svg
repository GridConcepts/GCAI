<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Five-step AI pilot structure</title><desc id="d">Five steps: pick one workflow with a named owner, write the metric and baseline down, confirm what the pilot will touch, set the threshold for advancing or stopping, then time-box it and hold the review against the written baseline.</desc><rect width="900" height="435" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">A structure that survives contact with the business</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Five steps in order</text><rect x="40" y="100" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><circle cx="68" cy="127" r="16" fill="#92ad39"/><text x="68" y="133" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="100" y="123" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Pick one workflow with a named owner</text><text x="100" y="142" font-size="12" fill="#657067" font-weight="400" text-anchor="start">A person accountable for the result, not a department</text><rect x="40" y="164" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><circle cx="68" cy="191" r="16" fill="#92ad39"/><text x="68" y="197" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="100" y="187" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Write the metric and baseline down</text><text x="100" y="206" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Before any tool is switched on</text><rect x="40" y="228" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><circle cx="68" cy="255" r="16" fill="#92ad39"/><text x="68" y="261" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="100" y="251" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Confirm what the pilot will touch</text><text x="100" y="270" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Which systems, which client data, whose systems it reaches into</text><rect x="40" y="292" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><circle cx="68" cy="319" r="16" fill="#92ad39"/><text x="68" y="325" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="100" y="315" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Set the threshold for advancing or stopping</text><text x="100" y="334" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Agreed with whoever holds the budget decision</text><rect x="40" y="356" width="820" height="54" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><circle cx="68" cy="383" r="16" fill="#92ad39"/><text x="68" y="389" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="100" y="379" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Time-box it, then hold the review</text><text x="100" y="398" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Against what was written down in step 2, not how the demo felt</text></svg>