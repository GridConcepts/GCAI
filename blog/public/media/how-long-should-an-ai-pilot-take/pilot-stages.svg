<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI pilot stages and durations</title><desc id="d">Four stages of a single-workflow AI pilot: discovery 1-3 weeks, setup and configuration 2-4 weeks, the pilot run 8-12 weeks, review and decision 1-2 weeks. Total around three to four months end to end.</desc><rect width="900" height="370" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">A single AI pilot, stage by stage</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">One workflow, one owner</text><rect x="40.0" y="100" width="196.0" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="56.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1-3 wks</text><text x="56.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Discovery</text><text x="56.0" y="190.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Pick one workflow, name</text><text x="56.0" y="207.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">an owner, capture</text><text x="56.0" y="223.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">baseline numbers</text><rect x="248.0" y="100" width="196.0" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="248.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="264.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2-4 wks</text><text x="264.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Setup and</text><text x="264.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">configuration</text><text x="264.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Connect the tool to real</text><text x="264.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">data, not a demo dataset</text><rect x="456.0" y="100" width="196.0" height="180" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><rect x="456.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="472.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">8-12 wks</text><text x="472.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">The pilot run</text><text x="472.0" y="190.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Trial measured against</text><text x="472.0" y="207.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">the baseline from day</text><text x="472.0" y="223.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">one</text><rect x="664.0" y="100" width="196.0" height="180" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="664.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="680.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1-2 wks</text><text x="680.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Review and decision</text><text x="680.0" y="190.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Compare to the agreed</text><text x="680.0" y="207.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">threshold: scale, adjust</text><text x="680.0" y="223.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">or stop</text><rect x="40" y="300" width="820" height="44" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="60" y="328" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Total: around three to four months end to end</text></svg>