<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Gartner AI project timelines</title><desc id="d">Gartner 2024 found organisations average 33.6 weeks from idea to production on a non-generative AI project and 29.3 weeks on a generative one, with roughly seven to eight weeks on idea vetting alone. A single well-scoped pilot runs around three to four months.</desc><rect width="900" height="395" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Enterprise AI projects take months</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Average time from idea to production, in weeks</text><text x="40" y="122" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Non-generative AI project</text><text x="860" y="124" font-size="16" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">33.6 weeks</text><rect x="40" y="132" width="820" height="14" fill="#e9ede0"/><rect x="40" y="132" width="688.8" height="14" fill="#53661c"/><text x="40" y="178" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Generative AI project</text><text x="860" y="180" font-size="16" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">29.3 weeks</text><rect x="40" y="188" width="820" height="14" fill="#e9ede0"/><rect x="40" y="188" width="600.6" height="14" fill="#92ad39"/><text x="40" y="238" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Source: Gartner 2024 AI Mandates for the Enterprise survey</text><rect x="40" y="260" width="402" height="110" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="312" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">7-8 weeks</text><text x="56" y="336.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">goes on idea vetting alone, before any build work starts</text><rect x="458" y="260" width="402" height="110" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="474" y="312" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3-4 months</text><text x="474" y="336.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">for one well-scoped pilot on one workflow, end to end</text></svg>