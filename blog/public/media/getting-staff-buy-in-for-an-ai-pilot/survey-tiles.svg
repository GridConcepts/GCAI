<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Employee resistance and AI use statistics</title><desc id="d">KPMG found resistance to AI agents rose to 20% from 5%. Gallup found 13% use AI daily, 18% think AI will likely eliminate their job within five years, and employees with visibly supportive managers are nearly twice as likely to use it frequently.</desc><rect width="900" height="270" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">What the surveys say about AI at work</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">KPMG Q2 2026 AI pulse survey and Gallup February 2026 survey</text><rect x="40" y="110" width="196" height="130" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="160" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">20%</text><text x="56" y="184.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">employee resistance to AI</text><text x="56" y="200.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">agents, up from 5% (KPMG)</text><rect x="248" y="110" width="196" height="130" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="264" y="160" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">13%</text><text x="264" y="184.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">use AI daily, though half</text><text x="264" y="200.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">use it in some form</text><text x="264" y="216.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">(Gallup)</text><rect x="456" y="110" width="196" height="130" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="472" y="160" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">18%</text><text x="472" y="184.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">think AI likely to cut</text><text x="472" y="200.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">their job in 5 years, up</text><text x="472" y="216.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">from 15% (Gallup)</text><rect x="664" y="110" width="196" height="130" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="680" y="160" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">~2x</text><text x="680" y="184.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">as likely to use AI often</text><text x="680" y="200.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">when managers visibly</text><text x="680" y="216.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">back it (Gallup)</text></svg>