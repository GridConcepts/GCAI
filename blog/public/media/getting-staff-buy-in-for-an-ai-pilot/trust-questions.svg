<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Three trust questions staff want answered</title><desc id="d">Staff want three specific questions answered early and without jargon: what does the tool actually see, what decision does it make on its own, and what happens if it gets something wrong.</desc><rect width="900" height="270" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Answer the trust question directly</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Three things staff want answered early, in plain language</text><rect x="40" y="104" width="260" height="140" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="136" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">What does the tool</text><text x="56" y="154.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">actually see?</text><text x="56" y="178" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Which systems, which data,</text><text x="56" y="194.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">whose information</text><rect x="320" y="104" width="260" height="140" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="336" y="136" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">What decision does it</text><text x="336" y="154.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">make on its own?</text><text x="336" y="178" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">What stays with a person,</text><text x="336" y="194.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">not the tool</text><rect x="600" y="104" width="260" height="140" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="616" y="136" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">What happens if it</text><text x="616" y="154.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">gets something wrong?</text><text x="616" y="178" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Who catches it, and what's</text><text x="616" y="194.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">the process for flagging it</text></svg>