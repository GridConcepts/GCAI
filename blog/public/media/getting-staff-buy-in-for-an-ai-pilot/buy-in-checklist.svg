<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Staff buy-in checklist for an AI pilot</title><desc id="d">Five steps before launch: name who is affected by role, involve two or three staff before scoping, say what happens to the task, name an internal champion, and set an adoption metric such as percentage using the tool by week four.</desc><rect width="900" height="400" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Change-management checklist before launch</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Run these before anyone touches the tool</text><rect x="40" y="105" width="820" height="34" fill="#1d2720" stroke="#1d2720" stroke-width="1"/><text x="52" y="127" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">STEP</text><text x="322" y="127" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="start" letter-spacing="0.8">WHAT TO DO</text><rect x="40" y="139" width="820" height="50" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="159.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">1. Name who is affected</text><text x="322" y="159.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">By role, not department: what changes for each one.</text><rect x="40" y="189" width="820" height="50" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="52" y="209.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">2. Involve two or three people</text><text x="322" y="209.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Before the pilot is scoped, not after it is built.</text><rect x="40" y="239" width="820" height="50" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="259.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">3. Say what happens to the task</text><text x="322" y="259.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Time, headcount and a fixed review date.</text><rect x="40" y="289" width="820" height="50" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="52" y="309.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">4. Name a champion</text><text x="322" y="309.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Inside the team, not just a sponsor above it.</text><rect x="40" y="339" width="820" height="50" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="52" y="359.0" font-size="12.5" fill="#1d2720" font-weight="700" text-anchor="start">5. Set an adoption metric</text><text x="322" y="359.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">For example, % using the tool by week four.</text></svg>