<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AML/CTF workflow and the human checkpoint</title><desc id="d">From 1 July 2026 a buyer's agent must run customer due diligence and identity checks, screen against sanctions and PEP lists, retain records for seven years and report suspicious matters to AUSTRAC. AI can assist the first three steps, but a named person makes the suspicious-matter call.</desc><rect width="900" height="280" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">AML/CTF from 1 July 2026</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Where AI helps and where a named person must decide</text><rect x="40.0" y="110" width="179.5" height="100" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="129.75" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">CDD and ID checks</text><text x="129.75" y="152" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">AI can collect and</text><text x="129.75" y="166" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">cross-check</text><line x1="225.5" y1="160.0" x2="247.5" y2="160.0" stroke="#92ad39" stroke-width="2"/><path d="M247.5 160.0 L241.2 163.0 M247.5 160.0 L241.2 157.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="253.5" y="110" width="179.5" height="100" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="343.25" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Sanctions and PEP</text><text x="343.25" y="152" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">screening</text><text x="343.25" y="168" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">AI flags matches</text><line x1="439.0" y1="160.0" x2="461.0" y2="160.0" stroke="#92ad39" stroke-width="2"/><path d="M461.0 160.0 L454.7 163.0 M461.0 160.0 L454.7 157.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="467.0" y="110" width="179.5" height="100" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="556.75" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Keep records 7 years</text><text x="556.75" y="152" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">AI keeps trail organised</text><line x1="652.5" y1="160.0" x2="674.5" y2="160.0" stroke="#92ad39" stroke-width="2"/><path d="M674.5 160.0 L668.2 163.0 M674.5 160.0 L668.2 157.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="680.5" y="110" width="179.5" height="100" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="770.25" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Report to AUSTRAC</text><text x="770.25" y="152" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">Named person decides</text><text x="40" y="250" font-size="13" fill="#657067" font-weight="400" text-anchor="start">The suspicious-matter judgement and its accountability cannot be automated.</text></svg>