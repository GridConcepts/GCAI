<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Four AI use cases in buyers agencies</title><desc id="d">Four production AI use cases: suburb and due-diligence research, document processing, client reporting, and enquiry and lead triage. The recommendation stays with a named person.</desc><rect width="900" height="350" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Where AI already works</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Four jobs in a buyers agency or advisory firm</text><rect x="40.0" y="110" width="196.75" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="110" width="196.75" height="5" fill="#92ad39"/><text x="56.0" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Suburb research</text><text x="56.0" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">First-pass due-diligence</text><text x="56.0" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">report, checked and</text><text x="56.0" y="232.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">signed off by an agent.</text><rect x="247.75" y="110" width="196.75" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="247.75" y="110" width="196.75" height="5" fill="#92ad39"/><text x="263.75" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="263.75" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Document processing</text><text x="263.75" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Clauses from contracts</text><text x="263.75" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">and reports, flagged</text><text x="263.75" y="232.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">against a template.</text><rect x="455.5" y="110" width="196.75" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="455.5" y="110" width="196.75" height="5" fill="#92ad39"/><text x="471.5" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="471.5" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Client reporting</text><text x="471.5" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Narrative drafted from</text><text x="471.5" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">data so advisors focus on</text><text x="471.5" y="232.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">judgement.</text><rect x="663.25" y="110" width="196.75" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="663.25" y="110" width="196.75" height="5" fill="#92ad39"/><text x="679.25" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="679.25" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Enquiry triage</text><text x="679.25" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Pre-qualify by budget,</text><text x="679.25" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">location and timeline.</text></svg>