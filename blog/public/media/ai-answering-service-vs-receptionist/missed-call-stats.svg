<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 276" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Missed call statistics</title><desc id="d">Only 37.8 percent of inbound calls were answered live in a study of small businesses, and 80 percent or more of callers who reach voicemail hang up without leaving a message.</desc><rect width="900" height="276" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">What happens to inbound calls</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Figures cited in the post</text><rect x="40" y="104" width="400" height="110" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="56" y="156" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">37.8%</text><text x="56" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of inbound calls were answered live; the rest hit</text><text x="56" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">voicemail or got no response</text><rect x="460" y="104" width="400" height="110" fill="#faf3ea" stroke="#c8a27a" stroke-width="1"/><text x="476" y="156" font-size="34" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">80%+</text><text x="476" y="180.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">of callers who reach voicemail hang up without leaving a</text><text x="476" y="196.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">message</text><text x="40" y="250" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Source: observational study of small businesses across dozens of industries, plus research on voicemail behaviour.</text></svg>