<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Where the message breaks down without a system to catch it</title><desc id="d">A call comes in, an answering service captures the message, it lands in a text or email, and someone has to retype it into the job system by hand later, which is the delay the answering service was meant to remove.</desc><rect width="900" height="330" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Where the message breaks down</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">A captured message is only as useful as what it lands in</text><rect x="40" y="96" width="196" height="190" fill="#fff" stroke="#d8ded0"/><rect x="40" y="96" width="196" height="5" fill="#92ad39"/><text x="56" y="140" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Call comes in</text><text x="56" y="164" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">After hours, or while</text><text x="56" y="181" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">you are already on</text><text x="56" y="198" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">the phone.</text><path d="M238 191 l8 0 m-4 -4 l4 4 l-4 4" fill="none" stroke="#92ad39" stroke-width="2"/><rect x="247" y="96" width="196" height="190" fill="#fff" stroke="#d8ded0"/><rect x="247" y="96" width="196" height="5" fill="#92ad39"/><text x="263" y="140" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Message is captured</text><text x="263" y="164" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Name, number and</text><text x="263" y="181" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">need, human or AI.</text><path d="M445 191 l8 0 m-4 -4 l4 4 l-4 4" fill="none" stroke="#92ad39" stroke-width="2"/><rect x="454" y="96" width="196" height="190" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="470" y="140" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Lands in a text or email</text><text x="470" y="164" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Complete, but sitting</text><text x="470" y="181" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">in an inbox, not a</text><text x="470" y="198" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">system.</text><path d="M652 191 l8 0 m-4 -4 l4 4 l-4 4" fill="none" stroke="#92ad39" stroke-width="2"/><rect x="661" y="96" width="196" height="190" fill="#fff" stroke="#d8ded0"/><rect x="661" y="96" width="196" height="5" fill="#92ad39"/><text x="677" y="140" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Retyped by hand, later</text><text x="677" y="164" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">The exact delay you</text><text x="677" y="181" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">were trying to</text><text x="677" y="198" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">remove.</text><text x="40" y="308" font-size="12" fill="#657067" font-weight="400" text-anchor="start">The handoff, not the answering service, is usually the weak point.</text></svg>
