<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">A useful sequence: data first, then AI</title><desc id="d">Four steps: find the trustworthy core of customer and operational data, agree the source of truth for each key field, clean a manageable slice, then add AI.</desc><rect width="900" height="320" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">A useful sequence: data first, then AI</text><rect x="40.0" y="90" width="196.75" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="90" width="196.75" height="5" fill="#92ad39"/><text x="56.0" y="128" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Find the trusted</text><text x="56.0" y="174.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">core</text><text x="56.0" y="198.4" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Pick the customer and</text><text x="56.0" y="214.5" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">operational data that</text><text x="56.0" y="230.6" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">matter most</text><rect x="247.75" y="90" width="196.75" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="247.75" y="90" width="196.75" height="5" fill="#92ad39"/><text x="263.75" y="128" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="263.75" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Agree the source of</text><text x="263.75" y="174.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">truth</text><text x="263.75" y="198.4" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Decide which system owns</text><text x="263.75" y="214.5" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">each key field</text><rect x="455.5" y="90" width="196.75" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="455.5" y="90" width="196.75" height="5" fill="#92ad39"/><text x="471.5" y="128" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="471.5" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Clean a manageable</text><text x="471.5" y="174.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">slice</text><text x="471.5" y="198.4" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Do not boil the ocean.</text><text x="471.5" y="214.5" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Fix the records people</text><text x="471.5" y="230.6" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">use</text><rect x="663.25" y="90" width="196.75" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="663.25" y="90" width="196.75" height="5" fill="#92ad39"/><text x="679.25" y="128" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="679.25" y="156.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Then add AI</text><text x="679.25" y="180.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Assistants, agents and</text><text x="679.25" y="196.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">reporting work better on</text><text x="679.25" y="212.39999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">connected ground</text></svg>