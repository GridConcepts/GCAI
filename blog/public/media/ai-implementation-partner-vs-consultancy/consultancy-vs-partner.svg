<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Consultancy vs implementation partner</title><desc id="d">Comparison of a consultancy, which delivers a strategy and is accountable for analysis, with an implementation partner, which delivers a working system within four to eight weeks.</desc><rect width="900" height="360" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Consultancy vs implementation partner</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">What each engagement is built to deliver</text><rect x="40.0" y="110" width="402.0" height="220" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="56.0" y="138" font-size="13" fill="#9a7442" font-weight="700" text-anchor="start" letter-spacing="1">CONSULTANCY</text><text x="76.0" y="172" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Deliverable is clarity: a strategy and roadmap</text><path d="M58.0 162 l9 9 M67.0 162 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="76.0" y="216" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Accountable for the quality of the analysis</text><path d="M58.0 206 l9 9 M67.0 206 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="76.0" y="260" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Engagement usually ends at the recommendation</text><path d="M58.0 250 l9 9 M67.0 250 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="76.0" y="304" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Discovery workshops still running at week eight</text><path d="M58.0 294 l9 9 M67.0 294 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><rect x="458.0" y="110" width="402.0" height="220" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="474.0" y="138" font-size="13" fill="#53661c" font-weight="700" text-anchor="start" letter-spacing="1">IMPLEMENTATION PARTNER</text><text x="494.0" y="172" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Deliverable is a working system in your tools</text><path d="M475.0 168 l4 4 l8 -9" stroke="#53661c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="494.0" y="216" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Accountable for a result measured in production</text><path d="M475.0 212 l4 4 l8 -9" stroke="#53661c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="494.0" y="260" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Working slice in front of real users in 4 to 8</text><text x="494.0" y="276" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">weeks</text><path d="M475.0 256 l4 4 l8 -9" stroke="#53661c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="494.0" y="304" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Builds capability so you can operate and extend it</text><path d="M475.0 300 l4 4 l8 -9" stroke="#53661c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>