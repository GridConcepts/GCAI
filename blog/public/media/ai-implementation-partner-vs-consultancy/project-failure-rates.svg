<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="t">AI projects that fail to deliver value</title>
<desc id="d">Bar chart showing RAND found 80% of enterprise AI projects fail to deliver the promised business value, and MIT's Project NANDA found around 95% of generative AI pilots show no measurable profit and loss return.</desc>
<rect width="900" height="320" fill="#f9faf5" stroke="#d8ded0"/>

<text x="30" y="42" font-family="Lora, Georgia, serif" font-weight="600" font-size="22" fill="#1d2720">AI projects that fail to deliver value</text>
<text x="30" y="64" font-size="13" fill="#657067">Two independent studies, same underlying pattern</text>

<!-- Bar 1: RAND 80% -->
<rect x="80" y="110" width="320" height="34" fill="#e9ede0"/>
<rect x="80" y="110" width="256" height="34" fill="#92ad39"/>
<text x="80" y="100" font-size="13" fill="#657067">RAND - enterprise AI projects</text>
<text x="410" y="134" font-family="Lora, Georgia, serif" font-weight="600" font-size="20" fill="#1d2720">80%</text>
<text x="80" y="162" font-size="12" fill="#657067">fail to deliver the business value promised</text>

<!-- Bar 2: MIT NANDA ~95% -->
<rect x="80" y="210" width="320" height="34" fill="#e9ede0"/>
<rect x="80" y="210" width="304" height="34" fill="#c8a27a"/>
<text x="80" y="200" font-size="13" fill="#657067">MIT Project NANDA - generative AI pilots</text>
<text x="410" y="234" font-family="Lora, Georgia, serif" font-weight="600" font-size="20" fill="#1d2720">~95%</text>
<text x="80" y="262" font-size="12" fill="#657067">show no measurable P&amp;L return</text>

<text x="30" y="300" font-size="12" fill="#657067">Source: RAND enterprise AI analysis; MIT Project NANDA, as cited in this article</text>
</svg>
