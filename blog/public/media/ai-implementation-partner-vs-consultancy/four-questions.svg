<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Four questions that separate a partner from a consultancy</title><desc id="d">Four first-meeting questions: what the last engagement produced, who is accountable for the agreed number, what is running by week eight, and who can operate it afterwards.</desc><rect width="900" height="340" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Four questions for a first meeting</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">They separate analysis from delivery</text><rect x="40.0" y="110" width="196.75" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="110" width="196.75" height="5" fill="#92ad39"/><text x="56.0" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Last engagement?</text><text x="56.0" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">A document, or a system</text><text x="56.0" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">running today?</text><rect x="247.75" y="110" width="196.75" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="247.75" y="110" width="196.75" height="5" fill="#92ad39"/><text x="263.75" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="263.75" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Who is accountable?</text><text x="263.75" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">If we miss the number we</text><text x="263.75" y="216.29999999999998" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">agreed on.</text><rect x="455.5" y="110" width="196.75" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="455.5" y="110" width="196.75" height="5" fill="#92ad39"/><text x="471.5" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="471.5" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Running by week</text><text x="471.5" y="194.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">eight?</text><text x="471.5" y="218.4" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">What touches real data by</text><text x="471.5" y="234.5" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">then.</text><rect x="663.25" y="110" width="196.75" height="190" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="663.25" y="110" width="196.75" height="5" fill="#92ad39"/><text x="679.25" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="679.25" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Who can operate it?</text><text x="679.25" y="200.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Once the engagement ends.</text></svg>