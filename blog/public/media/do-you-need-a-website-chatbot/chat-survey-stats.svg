<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 319" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI chat survey statistics</title><desc id="d">Five tiles: 56% often frustrated by AI service chatbots and 48% do not trust their information (Five9, 2024); 78% say a handoff to a person matters but only 15% say it has felt smooth (Twilio, 2025); 39% abandoned a purchase after a frustrating chat (Omnisend, 2025).</desc><rect width="900" height="319" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">What people say about AI chat</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Survey figures quoted in the post</text><rect x="40" y="110" width="160" height="124" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="56" y="162" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">56%</text><text x="56" y="186.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">often frustrated by</text><text x="56" y="202.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">AI service chatbots</text><text x="40" y="256" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Five9, 2024</text><rect x="215" y="110" width="160" height="124" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="231" y="162" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">48%</text><text x="231" y="186.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">do not trust what</text><text x="231" y="202.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">chatbots tell them</text><text x="215" y="256" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Five9, 2024</text><rect x="390" y="110" width="160" height="124" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="406" y="162" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">78%</text><text x="406" y="186.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">say a bot-to-person</text><text x="406" y="202.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">handoff matters</text><text x="390" y="256" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Twilio, 2025</text><rect x="565" y="110" width="160" height="124" fill="#faf3ea" stroke="#c8a27a" stroke-width="1"/><text x="581" y="162" font-size="34" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">15%</text><text x="581" y="186.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">say that handoff</text><text x="581" y="202.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">has ever felt</text><text x="581" y="218.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">smooth</text><text x="565" y="256" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Twilio, 2025</text><rect x="740" y="110" width="160" height="124" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="756" y="162" font-size="34" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">39%</text><text x="756" y="186.0" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">abandoned a</text><text x="756" y="202.1" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">purchase after a</text><text x="756" y="218.2" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">frustrating chat</text><text x="740" y="256" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Omnisend, 2025</text><text x="40" y="294" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Five9: survey of 4,000 consumers.</text></svg>