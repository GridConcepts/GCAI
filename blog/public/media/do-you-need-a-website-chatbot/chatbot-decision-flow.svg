<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Chatbot decision flow</title><desc id="d">Write down the five questions customers ask most, check where an enquiry currently lands, and if you cannot answer both quickly a chatbot is not your next move; otherwise consider a chatbot for narrow, repetitive questions.</desc><rect width="900" height="275" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Is a chatbot your next move?</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Two checks before you add one</text><rect x="40.0" y="110" width="179.5" height="96" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="129.75" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Write down the top 5</text><text x="129.75" y="152" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">questions</text><text x="129.75" y="168" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">customers ask most</text><line x1="225.5" y1="158.0" x2="247.5" y2="158.0" stroke="#92ad39" stroke-width="2"/><path d="M247.5 158.0 L241.2 161.0 M247.5 158.0 L241.2 155.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="253.5" y="110" width="179.5" height="96" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="343.25" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Check where</text><text x="343.25" y="152" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">enquiries land</text><text x="343.25" y="168" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">inbox, spreadsheet,</text><text x="343.25" y="182" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">notebook</text><line x1="439.0" y1="158.0" x2="461.0" y2="158.0" stroke="#92ad39" stroke-width="2"/><path d="M461.0 158.0 L454.7 161.0 M461.0 158.0 L454.7 155.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="467.0" y="110" width="179.5" height="96" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="556.75" y="136" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Can you answer both</text><text x="556.75" y="152" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">quickly?</text><text x="556.75" y="168" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">If not, a chatbot is not</text><text x="556.75" y="182" font-size="11" fill="#657067" font-weight="400" text-anchor="middle">your next move</text><line x1="652.5" y1="158.0" x2="674.5" y2="158.0" stroke="#92ad39" stroke-width="2"/><path d="M674.5 158.0 L668.2 161.0 M674.5 158.0 L668.2 155.0" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="680.5" y="110" width="179.5" height="96" fill="#92ad39" stroke="#92ad39" stroke-width="1"/><text x="770.25" y="136" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Then consider a</text><text x="770.25" y="152" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">chatbot</text><text x="770.25" y="168" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">narrow, repetitive</text><text x="770.25" y="182" font-size="11" fill="#ffffff" font-weight="400" text-anchor="middle">questions</text><text x="40" y="240.0" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">A chatbot is worth doing once repetitive questions eat staff time and whatever it captures has somewhere reliable to</text><text x="40" y="257.5" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">land.</text></svg>