<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">The four AI jobs worth automating for a trade business</title><desc id="d">1 Answer after-hours enquiries, roughly one in three trade calls missed. 2 Turn job notes into a quote, 8 to 12 hours a week of admin. 3 Scheduling and dispatch, reminders cut no-shows by 28.9 percent. 4 Chase admin, invoices paid 6.6 days late on average.</desc><rect width="900" height="520" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">The four jobs worth automating, in order of value</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Admin, not the trade itself</text><rect x="40" y="104" width="820" height="86" fill="#fff" stroke="#d8ded0"/><rect x="40" y="104" width="820" height="5" fill="#92ad39" fill-opacity="1.0"/><text x="64" y="158" font-size="30" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="108" y="142" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Answer after-hours enquiries</text><text x="108" y="166" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Capture name, number and need, confirm a call-back</text><rect x="560" y="122" width="1" height="52" fill="#d8ded0"/><text x="582" y="152" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">~1 in 3</text><text x="582" y="170" font-size="11" fill="#657067" font-weight="400" text-anchor="start">trade calls missed (industry</text><text x="582" y="184" font-size="11" fill="#657067" font-weight="400" text-anchor="start">estimate)</text><rect x="40" y="202" width="820" height="86" fill="#fff" stroke="#d8ded0"/><rect x="40" y="202" width="820" height="5" fill="#92ad39" fill-opacity="0.8"/><text x="64" y="256" font-size="30" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="108" y="240" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Turn job notes into a quote</text><text x="108" y="264" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Draft from your rates, a past job and a template</text><rect x="560" y="220" width="1" height="52" fill="#d8ded0"/><text x="582" y="250" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">8-12 hrs</text><text x="582" y="268" font-size="11" fill="#657067" font-weight="400" text-anchor="start">a week on tradie admin, mostly</text><text x="582" y="282" font-size="11" fill="#657067" font-weight="400" text-anchor="start">quoting and invoicing</text><rect x="40" y="300" width="820" height="86" fill="#fff" stroke="#d8ded0"/><rect x="40" y="300" width="820" height="5" fill="#92ad39" fill-opacity="0.6"/><text x="64" y="354" font-size="30" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="108" y="338" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Schedule and dispatch</text><text x="108" y="362" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Slot jobs by who is free, where they are, what the job needs</text><rect x="560" y="318" width="1" height="52" fill="#d8ded0"/><text x="582" y="348" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">28.9%</text><text x="582" y="366" font-size="11" fill="#657067" font-weight="400" text-anchor="start">fewer no-shows from automated</text><text x="582" y="380" font-size="11" fill="#657067" font-weight="400" text-anchor="start">reminders (29 studies)</text><rect x="40" y="398" width="820" height="86" fill="#fff" stroke="#d8ded0"/><rect x="40" y="398" width="820" height="5" fill="#92ad39" fill-opacity="0.4"/><text x="64" y="452" font-size="30" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="108" y="436" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Chase the boring admin</text><text x="108" y="460" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Review requests and overdue-invoice follow-ups on a schedule</text><rect x="560" y="416" width="1" height="52" fill="#d8ded0"/><text x="582" y="446" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">6.6 days</text><text x="582" y="464" font-size="11" fill="#657067" font-weight="400" text-anchor="start">average late payment (Xero,</text><text x="582" y="478" font-size="11" fill="#657067" font-weight="400" text-anchor="start">520,000 small businesses)</text></svg>