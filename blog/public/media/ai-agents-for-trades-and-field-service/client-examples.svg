<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Four client examples, one pattern</title><desc id="d">A real estate agency now captures and confirms after-hours enquiries immediately instead of letting them sit until Monday. A construction company drafts quotes from the closest past job instead of an estimator losing a day a week. A property lawyer captures only name, number and matter type after hours without a privacy problem. A salesperson drafts quotes from a dictated note after each visit instead of waiting until Friday.</desc><rect width="900" height="520" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">The same pattern, four different businesses</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Real client examples from Grid Concepts work</text><rect x="40" y="104" width="820" height="86" fill="#fff" stroke="#d8ded0"/><rect x="40" y="104" width="820" height="5" fill="#92ad39" fill-opacity="1.0"/><text x="64" y="158" font-size="30" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="108" y="142" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Real estate agency</text><text x="108" y="166" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Before: Sunday-night enquiries sat until Monday</text><rect x="560" y="122" width="1" height="52" fill="#d8ded0"/><text x="582" y="150" font-size="15" fill="#53661c" font-weight="700" text-anchor="start">Captured now</text><text x="582" y="168" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Confirmed the minute it arrives, in the CRM</text><rect x="40" y="202" width="820" height="86" fill="#fff" stroke="#d8ded0"/><rect x="40" y="202" width="820" height="5" fill="#92ad39" fill-opacity="0.8"/><text x="64" y="256" font-size="30" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="108" y="240" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Construction company</text><text x="108" y="264" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Before: estimator lost a day a week rebuilding quotes</text><rect x="560" y="220" width="1" height="52" fill="#d8ded0"/><text x="582" y="248" font-size="15" fill="#53661c" font-weight="700" text-anchor="start">Drafted from history</text><text x="582" y="266" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Built from the closest past job and rate card</text><rect x="40" y="300" width="820" height="86" fill="#fff" stroke="#d8ded0"/><rect x="40" y="300" width="820" height="5" fill="#92ad39" fill-opacity="0.6"/><text x="64" y="354" font-size="30" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="108" y="338" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Property lawyer</text><text x="108" y="362" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Before: clients call at 7pm when the firm is closed</text><rect x="560" y="318" width="1" height="52" fill="#d8ded0"/><text x="582" y="346" font-size="15" fill="#53661c" font-weight="700" text-anchor="start">Name, number, matter only</text><text x="582" y="364" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Nothing from the contract, no privacy problem</text><rect x="40" y="398" width="820" height="86" fill="#fff" stroke="#d8ded0"/><rect x="40" y="398" width="820" height="5" fill="#92ad39" fill-opacity="0.4"/><text x="64" y="452" font-size="30" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="108" y="436" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Salesperson</text><text x="108" y="460" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Before: on the road four days a week, quotes waited until Friday</text><rect x="560" y="416" width="1" height="52" fill="#d8ded0"/><text x="582" y="444" font-size="15" fill="#53661c" font-weight="700" text-anchor="start">Dictated after each visit</text><text x="582" y="462" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Quote drafted, follow-up scheduled automatically</text></svg>
