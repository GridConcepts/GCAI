<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Where to start with AI agents in a trade business</title><desc id="d">Pick one task, count it now, check the data and scheduling foundations, then automate that one task.</desc><rect width="900" height="330" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Where to start: one task, counted, on solid data</text><rect x="40" y="96" width="196" height="190" fill="#fff" stroke="#d8ded0"/><rect x="40" y="96" width="196" height="5" fill="#92ad39"/><text x="56" y="140" font-size="28" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56" y="170" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Pick one task</text><text x="56" y="194" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">The one costing you most.</text><text x="56" y="211" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">For emergency and callout</text><text x="56" y="228" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">trades, usually missed</text><text x="56" y="245" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">after-hours enquiries.</text><path d="M238 191 l8 0 m-4 -4 l4 4 l-4 4" fill="none" stroke="#92ad39" stroke-width="2"/><rect x="247" y="96" width="196" height="190" fill="#fff" stroke="#d8ded0"/><rect x="247" y="96" width="196" height="5" fill="#92ad39"/><text x="263" y="140" font-size="28" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="263" y="170" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Count it now</text><text x="263" y="194" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Missed calls, quote hours,</text><text x="263" y="211" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">no-shows or late invoices.</text><text x="263" y="228" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">You need a before number.</text><path d="M445 191 l8 0 m-4 -4 l4 4 l-4 4" fill="none" stroke="#92ad39" stroke-width="2"/><rect x="454" y="96" width="196" height="190" fill="#fff" stroke="#d8ded0"/><rect x="454" y="96" width="196" height="5" fill="#92ad39"/><text x="470" y="140" font-size="28" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="470" y="170" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Check the foundations</text><text x="470" y="194" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Job history, pricing and</text><text x="470" y="211" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">customer details in one</text><text x="470" y="228" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">reliable place. Scheduling</text><text x="470" y="245" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">off the whiteboard.</text><path d="M652 191 l8 0 m-4 -4 l4 4 l-4 4" fill="none" stroke="#92ad39" stroke-width="2"/><rect x="661" y="96" width="196" height="190" fill="#fff" stroke="#d8ded0"/><rect x="661" y="96" width="196" height="5" fill="#92ad39"/><text x="677" y="140" font-size="28" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="677" y="170" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Automate that one</text><text x="677" y="194" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Do not fix all four at once,</text><text x="677" y="211" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">and avoid accounting</text><text x="677" y="228" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">software relabelled for</text><text x="677" y="245" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">trades.</text><text x="40" y="308" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Not sure which task? The free AI-Readiness Data Check takes about ten minutes.</text></svg>