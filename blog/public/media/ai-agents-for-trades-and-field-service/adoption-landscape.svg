<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI adoption in Australia by measure</title><desc id="d">About 12 percent of businesses used AI on the ABS strict count in 2024-25. Under 10 percent call their use significant. 44 percent of SMEs use AI on any-use count but under 30 percent in construction and agriculture. 81 percent of office workers use AI versus 56 percent of manual workers.</desc><rect width="900" height="560" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">AI adoption: depends on how you count</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Australian businesses, from strict count to any use, and the trades gap</text><text x="40" y="120" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Strict count: businesses using AI, 2024-25</text><text x="860" y="122" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">about 12%</text><rect x="40" y="130" width="820" height="14" fill="#e9ede0"/><rect x="40" y="130" width="98.4" height="14" fill="#92ad39"/><text x="40" y="162" font-size="11" fill="#657067" font-weight="400" text-anchor="start">ABS</text><text x="40" y="190" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Significant use (fewer than 1 in 10)</text><text x="860" y="192" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">under 10%</text><rect x="40" y="200" width="820" height="14" fill="#e9ede0"/><rect x="40" y="200" width="82.0" height="14" fill="#c8a27a"/><text x="40" y="232" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Treasury Intergenerational Report 2026</text><text x="40" y="260" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">SME adoption, any use, Feb 2026</text><text x="860" y="262" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">44%</text><rect x="40" y="270" width="820" height="14" fill="#e9ede0"/><rect x="40" y="270" width="360.8" height="14" fill="#92ad39"/><text x="40" y="302" font-size="11" fill="#657067" font-weight="400" text-anchor="start">National AI Centre tracker</text><text x="40" y="330" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Construction and agriculture, any use</text><text x="860" y="332" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">under 30%</text><rect x="40" y="340" width="820" height="14" fill="#e9ede0"/><rect x="40" y="340" width="246.0" height="14" fill="#c8a27a"/><text x="40" y="372" font-size="11" fill="#657067" font-weight="400" text-anchor="start">National AI Centre tracker</text><text x="40" y="400" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Office-based workers using AI</text><text x="860" y="402" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">81%</text><rect x="40" y="410" width="820" height="14" fill="#e9ede0"/><rect x="40" y="410" width="664.2" height="14" fill="#92ad39"/><text x="40" y="442" font-size="11" fill="#657067" font-weight="400" text-anchor="start">AuDA Digital Lives 2026</text><text x="40" y="470" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Manual workers using AI</text><text x="860" y="472" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">56%</text><rect x="40" y="480" width="820" height="14" fill="#e9ede0"/><rect x="40" y="480" width="459.2" height="14" fill="#c8a27a"/><text x="40" y="512" font-size="11" fill="#657067" font-weight="400" text-anchor="start">AuDA Digital Lives 2026</text><text x="40" y="544" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Bars for "under" figures show the ceiling. Green = broad or office measure, tan = trades, manual or significant-use measure.</text></svg>