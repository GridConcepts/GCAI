<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Three AI data governance questions</title><desc id="d">Before an AI pilot starts, answer which system processes the data, whether the data is used to train anything beyond your own output, and whether it is stored onshore or overseas under Australian Privacy Principle 8.</desc><rect width="900" height="360" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Three questions to answer before day one</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Settle them before the pilot starts, not during it</text><rect x="40.0" y="100" width="265.3333333333333" height="170" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="100" width="265.3333333333333" height="5" fill="#92ad39"/><text x="56.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Which system processes the</text><text x="56.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">data?</text><text x="56.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Name the vendor and the product,</text><text x="56.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">not the category</text><rect x="317.3333333333333" y="100" width="265.3333333333333" height="170" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="317.3333333333333" y="100" width="265.3333333333333" height="5" fill="#92ad39"/><text x="333.3333333333333" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="333.3333333333333" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Is the data used to train</text><text x="333.3333333333333" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">anything?</text><text x="333.3333333333333" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Opt-out by default with some</text><text x="333.3333333333333" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">vendors, opt-in with others. Check</text><text x="333.3333333333333" y="242.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">the contract</text><rect x="594.6666666666666" y="100" width="265.3333333333333" height="170" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="594.6666666666666" y="100" width="265.3333333333333" height="5" fill="#92ad39"/><text x="610.6666666666666" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="610.6666666666666" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Onshore or overseas?</text><text x="610.6666666666666" y="190.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Under APP 8, overseas disclosure</text><text x="610.6666666666666" y="207.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">keeps you accountable for the</text><text x="610.6666666666666" y="223.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">recipient</text><rect x="40" y="290" width="820" height="46" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="58" y="318" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">If nobody can answer all three cleanly, that is the real output of week one.</text></svg>