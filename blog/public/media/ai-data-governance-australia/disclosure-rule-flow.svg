<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Does the 10 December 2026 disclosure rule apply to your pilot?</title><desc id="d">If AI output feeds a decision about a person and that decision significantly affects them, examples that qualify include loan or credit screening, algorithmic pricing, job-applicant shortlisting and eligibility checks, and the business must disclose this in its privacy policy before 10 December 2026.</desc><rect width="900" height="510" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Does the 10 December 2026 rule apply?</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">A decision that significantly affects an individual</text><rect x="170" y="100" width="560" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="450" y="135" font-size="14" fill="#1d2720" font-weight="700" text-anchor="middle">AI output feeds a decision about a person</text><line x1="450" y1="160" x2="450" y2="183" stroke="#92ad39" stroke-width="2"/><path d="M450 183 L447 176 M450 183 L453 176" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="170" y="183" width="560" height="60" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="450" y="218" font-size="14" fill="#1d2720" font-weight="700" text-anchor="middle">Does it significantly affect that person?</text><line x1="450" y1="243" x2="450" y2="266" stroke="#92ad39" stroke-width="2"/><path d="M450 266 L447 259 M450 266 L453 259" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><text x="465" y="259" font-size="11" fill="#657067" font-weight="400" text-anchor="start">if yes</text><rect x="170" y="266" width="560" height="130" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><text x="190" y="290" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Examples that qualify when a model does the substantive work:</text><rect x="190" y="302" width="255" height="36" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="202" y="325" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Loan or credit screening</text><rect x="455" y="302" width="255" height="36" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="467" y="325" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Algorithmic pricing</text><rect x="190" y="348" width="255" height="36" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="202" y="371" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Job-applicant shortlisting</text><rect x="455" y="348" width="255" height="36" fill="#f9faf5" stroke="#d8ded0" stroke-width="1"/><text x="467" y="371" font-size="12" fill="#1d2720" font-weight="400" text-anchor="start">Eligibility checks</text><line x1="450" y1="396" x2="450" y2="419" stroke="#92ad39" stroke-width="2"/><path d="M450 419 L447 412 M450 419 L453 412" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><rect x="170" y="419" width="560" height="60" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="450" y="454" font-size="14" fill="#53661c" font-weight="700" text-anchor="middle">Disclose it in your privacy policy before 10 Dec 2026</text></svg>
