<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Building governance into an AI pilot</title><desc id="d">Four steps: name the systems and vendors in scope, draft automated-decision disclosure language early ahead of 10 December 2026, put one person's name against the three answers, and revisit the small-business exemption annually.</desc><rect width="900" height="325" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Build governance into the pilot</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Four practical steps</text><rect x="40.0" y="100" width="196.0" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="56.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Name systems and</text><text x="56.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">vendors</text><text x="56.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Confirm each one's data</text><text x="56.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">location and</text><text x="56.0" y="242.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">training-use policy in</text><text x="56.0" y="258.8" font-size="12" fill="#657067" font-weight="400" text-anchor="start">writing</text><rect x="248.0" y="100" width="196.0" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="248.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="264.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="264.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Draft disclosure</text><text x="264.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">language early</text><text x="264.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">If output touches</text><text x="264.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">customer-facing</text><text x="264.0" y="242.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">decisions, due 10</text><text x="264.0" y="258.8" font-size="12" fill="#657067" font-weight="400" text-anchor="start">December 2026</text><rect x="456.0" y="100" width="196.0" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="456.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="472.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="472.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Put one person's</text><text x="472.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">name on the answers</text><text x="472.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Not IT or the vendor</text><rect x="664.0" y="100" width="196.0" height="200" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="664.0" y="100" width="196.0" height="5" fill="#92ad39"/><text x="680.0" y="138" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="680.0" y="166.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Revisit the</text><text x="680.0" y="184.2" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">exemption annually</text><text x="680.0" y="208.4" font-size="12" fill="#657067" font-weight="400" text-anchor="start">The under $3 million</text><text x="680.0" y="225.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">small-business threshold</text><text x="680.0" y="242.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">is under review</text></svg>