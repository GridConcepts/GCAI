<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">The two jobs worth automating first in a hospitality venue</title><desc id="d">One, build the roster, matching demand and award rules automatically and flagging breaches before the roster is sent. Two, track stock continuously, reconciling sales data against counts so a stocktake is a check, not a count from scratch.</desc><rect width="900" height="400" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="44" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">The two jobs worth fixing first</text><text x="40" y="70" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Not the whole venue, not every system - these two</text><rect x="40" y="94" width="400" height="280" fill="#ffffff" stroke="#d8ded0"/><rect x="40" y="94" width="400" height="5" fill="#92ad39"/><text x="64" y="140" font-size="32" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="108" y="136" font-size="17" fill="#1d2720" font-weight="700" text-anchor="start">Build the roster</text><text x="64" y="168" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Starts from last week's sales pattern and who is</text><text x="64" y="186" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">actually available, not a blank template</text><text x="64" y="214" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Applies award rates and penalty rates, and flags a</text><text x="64" y="232" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">breach before the roster goes out, not after payday</text><rect x="64" y="256" width="352" height="1" fill="#e9ede0"/><text x="64" y="288" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">0.05-0.08%</text><text x="64" y="308" font-size="11" fill="#657067" font-weight="400" text-anchor="start">monthly hiring rate in 2025, down from 0.15% in</text><text x="64" y="324" font-size="11" fill="#657067" font-weight="400" text-anchor="start">2022 - fewer hands to cover the same shifts</text><text x="64" y="356" font-size="11.5" fill="#1d2720" font-weight="600" text-anchor="start">First step: check this week's roster against the</text><text x="64" y="372" font-size="11.5" fill="#1d2720" font-weight="600" text-anchor="start">award calculator before you send it</text><rect x="460" y="94" width="400" height="280" fill="#ffffff" stroke="#d8ded0"/><rect x="460" y="94" width="400" height="5" fill="#c8a27a"/><text x="484" y="140" font-size="32" fill="#8a6a42" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="528" y="136" font-size="17" fill="#1d2720" font-weight="700" text-anchor="start">Track stock continuously</text><text x="484" y="168" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Matches POS sales data against supplier invoices</text><text x="484" y="186" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">and on-hand counts between full stocktakes</text><text x="484" y="214" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Flags a variance while it is still small, instead of</text><text x="484" y="232" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">finding it at the end-of-month count</text><rect x="484" y="256" width="352" height="1" fill="#e9ede0"/><text x="484" y="288" font-size="26" fill="#8a6a42" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">31-46%</text><text x="484" y="308" font-size="11" fill="#657067" font-weight="400" text-anchor="start">of turnover is cost of sales for pubs, taverns and</text><text x="484" y="324" font-size="11" fill="#657067" font-weight="400" text-anchor="start">bars (ATO benchmark) - a small leak adds up fast</text><text x="484" y="356" font-size="11.5" fill="#1d2720" font-weight="600" text-anchor="start">First step: pick one line - draught beer or a high-</text><text x="484" y="372" font-size="11.5" fill="#1d2720" font-weight="600" text-anchor="start">value spirit - and reconcile it against sales weekly</text></svg>
