<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t2 d2" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="t2">What happens when stock data lives in three different places</title>
<desc id="d2">A flow diagram showing POS sales data, supplier invoices, and the physical stock count feeding into a variance check, which then either flags a spirit bottle as missing, a keg as under-poured, or a delivery as never checked in.</desc>
<rect width="900" height="460" fill="#f9faf5" stroke="#d8ded0"/>
<text x="40" y="38" font-family="Lora, Georgia, serif" font-size="22" font-weight="600" fill="#1d2720">When stock data lives in three places</text>
<text x="40" y="60" font-size="13" fill="#657067">Scattered records undermine a quick, trustworthy variance check</text>

<rect x="40" y="70" width="220" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="150" y="110" text-anchor="middle" font-size="14" fill="#1d2720">POS sales data</text>

<rect x="40" y="215" width="220" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="150" y="255" text-anchor="middle" font-size="14" fill="#1d2720">Supplier invoices</text>

<rect x="40" y="360" width="220" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="150" y="394" text-anchor="middle" font-size="14" fill="#1d2720">Physical stock</text>
<text x="150" y="412" text-anchor="middle" font-size="14" fill="#1d2720">count</text>

<rect x="340" y="200" width="220" height="100" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="450" y="245" text-anchor="middle" font-size="14" fill="#1d2720" font-weight="600">Variance check</text>
<text x="450" y="266" text-anchor="middle" font-size="14" fill="#1d2720" font-weight="600">runs</text>

<rect x="640" y="70" width="220" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="750" y="100" text-anchor="middle" font-size="13" fill="#1d2720">A bottle is missing</text>
<text x="750" y="118" text-anchor="middle" font-size="13" fill="#1d2720">and no one notices</text>

<rect x="640" y="215" width="220" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="750" y="241" text-anchor="middle" font-size="13" fill="#1d2720">A keg is poured light</text>
<text x="750" y="259" text-anchor="middle" font-size="13" fill="#1d2720">for weeks unseen</text>

<rect x="640" y="360" width="220" height="70" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="750" y="386" text-anchor="middle" font-size="13" fill="#1d2720">A delivery is never</text>
<text x="750" y="404" text-anchor="middle" font-size="13" fill="#1d2720">checked against the order</text>

<line x1="260" y1="105" x2="338" y2="235" stroke="#92ad39" stroke-width="2"/>
<path d="M 338 235 L 326 229 L 328 240 Z" fill="#92ad39"/>
<line x1="260" y1="250" x2="338" y2="250" stroke="#92ad39" stroke-width="2"/>
<path d="M 338 250 L 328 245 L 328 255 Z" fill="#92ad39"/>
<line x1="260" y1="395" x2="338" y2="265" stroke="#92ad39" stroke-width="2"/>
<path d="M 338 265 L 328 260 L 326 271 Z" fill="#92ad39"/>

<line x1="562" y1="235" x2="638" y2="105" stroke="#92ad39" stroke-width="2"/>
<path d="M 638 105 L 627 103 L 632 113 Z" fill="#92ad39"/>
<line x1="562" y1="250" x2="638" y2="250" stroke="#92ad39" stroke-width="2"/>
<path d="M 638 250 L 628 245 L 628 255 Z" fill="#92ad39"/>
<line x1="562" y1="265" x2="638" y2="395" stroke="#92ad39" stroke-width="2"/>
<path d="M 638 395 L 632 387 L 627 397 Z" fill="#92ad39"/>
</svg>
