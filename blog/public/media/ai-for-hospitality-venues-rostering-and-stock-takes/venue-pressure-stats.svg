<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Why rostering and stock takes eat so much of a venue manager's week</title><desc id="d">Hospitality shift activity rose 28 percent while hiring rates fell from about 0.15 percent a month in 2022 to 0.05 to 0.08 percent in 2025. Over half of operators cite rising food and supply costs. Cost of sales for pubs, taverns and bars runs 31 to 46 percent of turnover. The Fair Work Ombudsman recovered over 450 million dollars in unpaid wages in 2025-26.</desc><rect width="900" height="560" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">More shifts, fewer hands, tighter margins</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">The pressure behind every roster and every stocktake right now</text><text x="40" y="120" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Hospitality shift activity, 2025 vs prior year</text><text x="860" y="122" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">up 28%</text><rect x="40" y="130" width="820" height="14" fill="#e9ede0"/><rect x="40" y="130" width="400" height="14" fill="#92ad39"/><text x="40" y="162" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Deputy, The Big Shift Report 2026</text><text x="40" y="190" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Monthly hiring rate, hospitality (2022 to 2025)</text><text x="860" y="192" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">0.15% to 0.05-0.08%</text><rect x="40" y="200" width="820" height="14" fill="#e9ede0"/><rect x="40" y="200" width="150" height="14" fill="#c8a27a"/><text x="40" y="232" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Deputy, The Big Shift Report 2026</text><text x="40" y="260" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Operators citing rising food and supply costs</text><text x="860" y="262" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">52%</text><rect x="40" y="270" width="820" height="14" fill="#e9ede0"/><rect x="40" y="270" width="426.4" height="14" fill="#92ad39"/><text x="40" y="302" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Lightspeed Hospitality Report 2026</text><text x="40" y="330" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Cost of sales, pubs/taverns/bars (by turnover band)</text><text x="860" y="332" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">31% to 46%</text><rect x="40" y="340" width="820" height="14" fill="#e9ede0"/><rect x="40" y="340" width="377.2" height="14" fill="#c8a27a"/><text x="40" y="372" font-size="11" fill="#657067" font-weight="400" text-anchor="start">ATO small business benchmarks, 2023-24</text><text x="40" y="400" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Wages recovered nationally, all industries, 2025-26</text><text x="860" y="402" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">$450m+</text><rect x="40" y="410" width="820" height="14" fill="#e9ede0"/><rect x="40" y="410" width="500" height="14" fill="#92ad39"/><text x="40" y="442" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Fair Work Ombudsman, 2025-26 annual report</text><text x="40" y="470" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Workers back-paid nationally, 2025-26</text><text x="860" y="472" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">181,000+</text><rect x="40" y="480" width="820" height="14" fill="#e9ede0"/><rect x="40" y="480" width="470" height="14" fill="#c8a27a"/><text x="40" y="512" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Fair Work Ombudsman, 2025-26 annual report</text><text x="40" y="544" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Wage figures are economy-wide; hospitality was among the sectors named in 2025-26 enforcement activity.</text></svg>
