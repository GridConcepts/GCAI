<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Build or buy: the deciding question</title><desc id="d">Decision guide. If the capability is not specific to your business, buy from a vendor. If it creates an advantage a competitor could not copy, build or co-build. Resource-constrained SMEs should buy first and revisit build later.</desc><rect width="900" height="440" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Build or buy: the deciding question</text><rect x="40" y="100" width="820" height="56" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="450" y="134" font-size="15" fill="#1d2720" font-weight="700" text-anchor="middle">Does this create an advantage specific to our business?</text><line x1="250" y1="156" x2="250" y2="196" stroke="#92ad39" stroke-width="2"/><path d="M250 196 L247.0 189.7 M250 196 L253.0 189.7" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><line x1="650" y1="156" x2="650" y2="196" stroke="#92ad39" stroke-width="2"/><path d="M650 196 L647.0 189.7 M650 196 L653.0 189.7" fill="none" stroke="#92ad39" stroke-width="2" stroke-linecap="round"/><text x="262" y="182" font-size="11" fill="#53661c" font-weight="700" text-anchor="start">NO</text><text x="662" y="182" font-size="11" fill="#53661c" font-weight="700" text-anchor="start">YES</text><rect x="40" y="204" width="400" height="130" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40" y="204" width="400" height="5" fill="#92ad39"/><text x="56" y="234.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Buy from a vendor who has solved it</text><text x="56" y="258.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Every business like yours needs it in roughly the same</text><text x="56" y="275.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">form. Most quoting, scheduling, CRM and</text><text x="56" y="291.79999999999995" font-size="12" fill="#657067" font-weight="400" text-anchor="start">document-automation cases.</text><rect x="460" y="204" width="400" height="130" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><rect x="460" y="204" width="400" height="5" fill="#92ad39"/><text x="476" y="234.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Build, or co-build with a partner</text><text x="476" y="258.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">A model or process unique to how you operate, which a</text><text x="476" y="275.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">competitor could not copy by buying the same tool.</text><rect x="40" y="354" width="820" height="62" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="56" y="378.0" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Resource-constrained SME? Buying is the realistic option. Prove the use case, keep data ownership and exit terms</text><text x="56" y="395.5" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">clean, and revisit build later.</text></svg>