<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">What build and buy really cost</title><desc id="d">Build: data scientist salaries of 115,000 to 135,000 dollars, one hire over 200,000 dollars fully loaded, a second engineering skill set needed, and 15% to 25% annual upkeep. Buy: usage-based pricing, lock-in, and varying vendor accountability for outcomes.</desc><rect width="900" height="340" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">What build and buy really cost</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Both sides need honest costing</text><rect x="40.0" y="100" width="402.0" height="220" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="56.0" y="128" font-size="13" fill="#9a7442" font-weight="700" text-anchor="start" letter-spacing="1">BUILD: SALARY IS ONLY THE START</text><text x="76.0" y="162" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Data scientist $115k-$135k (SEEK); senior ML</text><text x="76.0" y="178" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">$180k-$215k+</text><path d="M58.0 152 l9 9 M67.0 152 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="76.0" y="206" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">One experienced hire clears $200k a year fully</text><text x="76.0" y="222" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">loaded</text><path d="M58.0 196 l9 9 M67.0 196 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="76.0" y="250" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">One person is not a team: production needs</text><text x="76.0" y="266" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">engineering too</text><path d="M58.0 240 l9 9 M67.0 240 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="76.0" y="294" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Upkeep is roughly 15% to 25% of build cost every</text><text x="76.0" y="310" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">year</text><path d="M58.0 284 l9 9 M67.0 284 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><rect x="458.0" y="100" width="402.0" height="220" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="474.0" y="128" font-size="13" fill="#9a7442" font-weight="700" text-anchor="start" letter-spacing="1">BUY: RISKS TO NAME UPFRONT</text><text x="494.0" y="162" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Usage-based pricing can scale past the pilot tier</text><path d="M476.0 152 l9 9 M485.0 152 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="494.0" y="206" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Lock-in if the contract skips data, code and</text><text x="494.0" y="222" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">export rights</text><path d="M476.0 196 l9 9 M485.0 196 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="494.0" y="250" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Some vendors sell a tool; others own the outcome</text><path d="M476.0 240 l9 9 M485.0 240 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="494.0" y="294" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">A badly managed vendor can cost as much as a bad</text><text x="494.0" y="310" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">team</text><path d="M476.0 284 l9 9 M485.0 284 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>