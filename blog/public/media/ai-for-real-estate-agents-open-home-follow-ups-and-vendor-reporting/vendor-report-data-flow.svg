<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t3 d3" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="t3">What a vendor report actually has to pull together</title>
<desc id="d3">A flow diagram showing portal views, enquiries, open-home attendance and the agent's own notes feeding into a draft vendor report, which then leads to the agent's actual conversation with the vendor about price and strategy.</desc>
<rect width="900" height="460" fill="#f9faf5" stroke="#d8ded0"/>
<text x="40" y="38" font-family="Lora, Georgia, serif" font-size="22" font-weight="600" fill="#1d2720">What a vendor report has to pull together</text>
<text x="40" y="60" font-size="13" fill="#657067">Four sources, usually four separate logins, every single week</text>

<rect x="40" y="80" width="220" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="150" y="115" text-anchor="middle" font-size="13" fill="#1d2720">Portal views</text>

<rect x="40" y="165" width="220" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="150" y="200" text-anchor="middle" font-size="13" fill="#1d2720">Enquiries</text>

<rect x="40" y="250" width="220" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="150" y="285" text-anchor="middle" font-size="13" fill="#1d2720">Open-home attendance</text>

<rect x="40" y="335" width="220" height="60" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="150" y="370" text-anchor="middle" font-size="13" fill="#1d2720">Agent's own notes</text>

<rect x="365" y="175" width="220" height="110" fill="#f1f6e6" stroke="#92ad39" stroke-width="1.5"/>
<text x="475" y="220" text-anchor="middle" font-size="14" fill="#1d2720" font-weight="600">Draft vendor report</text>
<text x="475" y="240" text-anchor="middle" font-size="12" fill="#657067">assembled automatically</text>
<text x="475" y="258" text-anchor="middle" font-size="12" fill="#657067">from the four sources</text>

<rect x="665" y="175" width="195" height="110" fill="#ffffff" stroke="#c8a27a" stroke-width="1.5"/>
<text x="762" y="220" text-anchor="middle" font-size="13" fill="#1d2720" font-weight="600">Your call with</text>
<text x="762" y="238" text-anchor="middle" font-size="13" fill="#1d2720" font-weight="600">the vendor</text>
<text x="762" y="262" text-anchor="middle" font-size="11" fill="#657067">on price and strategy</text>

<line x1="260" y1="110" x2="363" y2="210" stroke="#92ad39" stroke-width="2"/>
<path d="M 363 210 L 351 205 L 354 216 Z" fill="#92ad39"/>
<line x1="260" y1="195" x2="363" y2="222" stroke="#92ad39" stroke-width="2"/>
<path d="M 363 222 L 351 219 L 355 230 Z" fill="#92ad39"/>
<line x1="260" y1="280" x2="363" y2="243" stroke="#92ad39" stroke-width="2"/>
<path d="M 363 243 L 351 246 L 355 235 Z" fill="#92ad39"/>
<line x1="260" y1="365" x2="363" y2="255" stroke="#92ad39" stroke-width="2"/>
<path d="M 363 255 L 350 254 L 357 264 Z" fill="#92ad39"/>

<line x1="585" y1="230" x2="663" y2="230" stroke="#c8a27a" stroke-width="2"/>
<path d="M 663 230 L 653 225 L 653 235 Z" fill="#c8a27a"/>

<text x="40" y="430" font-size="11" fill="#657067">AI can assemble the recap. The vendor still wants to hear what it means for their price and timing from you.</text>
</svg>
