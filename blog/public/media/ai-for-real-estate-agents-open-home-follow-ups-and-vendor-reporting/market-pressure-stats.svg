<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">A quieter market, a louder vendor</title><desc id="d">Melbourne's median days on market reached 42 in June 2026, national open-home attendance fell to 2.1 people per inspection from 3.6 a year earlier, real estate agents average 46 hours a week against 44 for all occupations, 29.6 percent of landlords want direct access to data on their own investment, and about 12 percent of Australian businesses used AI in 2024-25.</desc><rect width="900" height="510" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">A quieter market, a louder vendor</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">The pressure behind every open home and every weekly report right now</text><text x="40" y="120" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Melbourne median days on market, private sales (June 2026)</text><text x="860" y="122" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">42 days</text><rect x="40" y="130" width="820" height="14" fill="#e9ede0"/><rect x="40" y="130" width="380" height="14" fill="#92ad39"/><text x="40" y="162" font-size="11" fill="#657067" font-weight="400" text-anchor="start">REIV, Cameron Kusher market commentary - up from 39 days a year earlier</text><text x="40" y="190" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">National average open-home attendance, mid-2026</text><text x="860" y="192" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">2.1, down from 3.6</text><rect x="40" y="200" width="820" height="14" fill="#e9ede0"/><rect x="40" y="200" width="180" height="14" fill="#c8a27a"/><text x="40" y="232" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Ray White chief economist commentary, four weeks to 11 July</text><text x="40" y="260" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Real estate agents' average weekly hours (full-time)</text><text x="860" y="262" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">46 vs 44 hrs</text><rect x="40" y="270" width="820" height="14" fill="#e9ede0"/><rect x="40" y="270" width="420" height="14" fill="#92ad39"/><text x="40" y="302" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Jobs and Skills Australia, ANZSCO 612114, 2021 Census - against all occupations</text><text x="40" y="330" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Landlords seeking direct access to data on their own investment</text><text x="860" y="332" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">29.6%</text><rect x="40" y="340" width="820" height="14" fill="#e9ede0"/><rect x="40" y="340" width="243" height="14" fill="#c8a27a"/><text x="40" y="372" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Reapit, State of the Australian Real Estate Market 2026 (500+ agents and PMs surveyed)</text><text x="40" y="400" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Australian businesses using AI, 2024-25</text><text x="860" y="402" font-size="17" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">~12%</text><rect x="40" y="410" width="820" height="14" fill="#e9ede0"/><rect x="40" y="410" width="98" height="14" fill="#92ad39"/><text x="40" y="442" font-size="11" fill="#657067" font-weight="400" text-anchor="start">ABS - up from about 1% in 2021-22</text><text x="40" y="474" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Days-on-market figure is Victorian; attendance, hours and adoption figures are national.</text></svg>
