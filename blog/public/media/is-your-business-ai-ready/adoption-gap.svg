<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Australian business AI adoption versus readiness</title><desc id="d">Two-thirds of Australian businesses use AI in some form, but fewer than one in ten describe that use as significant. 46 percent of SMEs have no plan to adopt AI and 85 percent have no formal AI policy.</desc><rect width="900" height="470" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Adoption is high. Readiness is not.</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Australian business AI figures, 2026</text><text x="40" y="126" font-size="14" fill="#1d2720" font-weight="600" text-anchor="start">Businesses using AI in some form</text><text x="860" y="126" font-size="18" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">Two-thirds</text><rect x="40" y="138" width="820" height="16" fill="#e9ede0"/><rect x="40" y="138" width="546.94" height="16" fill="#92ad39"/><text x="40" y="174" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Treasury Intergenerational Report</text><text x="40" y="210" font-size="14" fill="#1d2720" font-weight="600" text-anchor="start">Describe that use as significant</text><text x="860" y="210" font-size="18" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">Fewer than 1 in 10</text><rect x="40" y="222" width="820" height="16" fill="#e9ede0"/><rect x="40" y="222" width="82.0" height="16" fill="#c8a27a"/><text x="40" y="258" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Treasury Intergenerational Report</text><text x="40" y="294" font-size="14" fill="#1d2720" font-weight="600" text-anchor="start">SMEs with no plan to adopt AI</text><text x="860" y="294" font-size="18" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">46%</text><rect x="40" y="306" width="820" height="16" fill="#e9ede0"/><rect x="40" y="306" width="377.2" height="16" fill="#c8a27a"/><text x="40" y="342" font-size="11" fill="#657067" font-weight="400" text-anchor="start">MYOB Business Monitor</text><text x="40" y="378" font-size="14" fill="#1d2720" font-weight="600" text-anchor="start">SMEs with no formal AI policy</text><text x="860" y="378" font-size="18" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">85%</text><rect x="40" y="390" width="820" height="16" fill="#e9ede0"/><rect x="40" y="390" width="697.0" height="16" fill="#c8a27a"/><text x="40" y="426" font-size="11" fill="#657067" font-weight="400" text-anchor="start">MYOB Business Monitor</text><text x="40" y="452" font-size="11" fill="#657067" font-weight="400" text-anchor="start">Bars are approximate where the source gives a range (two-thirds, fewer than one in ten).</text></svg>