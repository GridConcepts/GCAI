<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Ten signs a business is not AI-ready</title><desc id="d">Routine enquiries waiting hours, no pain point in numbers, a core system that cannot connect, records in more than one place, no owner, no before number, unknown data destination, no staff AI rules, processes in people's heads, and out-of-date source information.</desc><rect width="900" height="640" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">10 signs you are not AI-ready yet</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Grouped by the three foundations: data, systems, people (grouping is Grid Concepts' reading)</text><rect x="40" y="108" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="40" y="108" width="8" height="84" fill="#1d2720"/><text x="68" y="158" font-size="28" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="116" y="148" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Routine enquiries wait hours for a</text><text x="116" y="168" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">reply</text><rect x="460" y="108" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="460" y="108" width="8" height="84" fill="#c8a27a"/><text x="488" y="158" font-size="28" fill="#c8a27a" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="536" y="148" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Nobody can describe the pain point</text><text x="536" y="168" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">in numbers</text><rect x="40" y="208" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="40" y="208" width="8" height="84" fill="#1d2720"/><text x="68" y="258" font-size="28" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="116" y="248" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Core system is mid-migration or</text><text x="116" y="268" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">cannot connect</text><rect x="460" y="208" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="460" y="208" width="8" height="84" fill="#92ad39"/><text x="488" y="258" font-size="28" fill="#92ad39" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">4</text><text x="536" y="248" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Customer records live in more than</text><text x="536" y="268" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">one place</text><rect x="40" y="308" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="40" y="308" width="8" height="84" fill="#c8a27a"/><text x="68" y="358" font-size="28" fill="#c8a27a" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">5</text><text x="116" y="356" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Nobody owns the result</text><rect x="460" y="308" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="460" y="308" width="8" height="84" fill="#92ad39"/><text x="488" y="358" font-size="28" fill="#92ad39" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">6</text><text x="536" y="356" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">There is no before number</text><rect x="40" y="408" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="40" y="408" width="8" height="84" fill="#c8a27a"/><text x="68" y="458" font-size="28" fill="#c8a27a" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">7</text><text x="116" y="448" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">You cannot say where your data</text><text x="116" y="468" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">goes</text><rect x="460" y="408" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="460" y="408" width="8" height="84" fill="#c8a27a"/><text x="488" y="458" font-size="28" fill="#c8a27a" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">8</text><text x="536" y="448" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Staff use AI and nobody has set</text><text x="536" y="468" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">the rules</text><rect x="40" y="508" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="40" y="508" width="8" height="84" fill="#1d2720"/><text x="68" y="558" font-size="28" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">9</text><text x="116" y="556" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Processes live in people's heads</text><rect x="460" y="508" width="400" height="84" fill="#fff" stroke="#d8ded0"/><rect x="460" y="508" width="8" height="84" fill="#92ad39"/><text x="488" y="558" font-size="28" fill="#92ad39" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">10</text><text x="536" y="548" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">The information you would train on</text><text x="536" y="568" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">is out of date</text><rect x="40" y="606" width="18" height="14" fill="#92ad39"/><text x="66" y="618" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Data foundations</text><rect x="290" y="606" width="18" height="14" fill="#1d2720"/><text x="316" y="618" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Systems and process</text><rect x="540" y="606" width="18" height="14" fill="#c8a27a"/><text x="566" y="618" font-size="12" fill="#657067" font-weight="400" text-anchor="start">People and governance</text></svg>