<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">What AI-ready looks like</title><desc id="d">Three foundations: data, connected systems and trained people. Plus four return signals: a task that eats ten or more hours a week, unused data, stable connectable tools and a senior decision-maker.</desc><rect width="900" height="500" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">What AI-ready actually looks like</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Three foundations holding up at once, then four signals you can get a return now</text><rect x="40" y="104" width="260" height="150" fill="#f1f5e2" stroke="#92ad39"/><text x="60" y="140" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Data foundations</text><text x="60" y="168" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">One trustworthy source for</text><text x="60" y="188" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">customer and job information,</text><text x="60" y="208" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">not three competing copies.</text><rect x="320" y="104" width="260" height="150" fill="#f1f5e2" stroke="#92ad39"/><text x="340" y="140" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Systems that talk</text><text x="340" y="168" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">CRM, quoting, scheduling and</text><text x="340" y="188" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">finance connected so nobody</text><text x="340" y="208" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">retypes the same details.</text><rect x="600" y="104" width="260" height="150" fill="#f1f5e2" stroke="#92ad39"/><text x="620" y="140" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">People who know what is safe</text><text x="620" y="168" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">Basic training and plain</text><text x="620" y="188" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">answers on governance and</text><text x="620" y="208" font-size="12.5" fill="#657067" font-weight="400" text-anchor="start">privacy before anyone asks.</text><rect x="40" y="254" width="820" height="26" fill="#92ad39"/><text x="450" y="272" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" letter-spacing="2">= READY FOUNDATIONS</text><text x="40" y="318" font-size="11" fill="#53661c" font-weight="700" text-anchor="start" letter-spacing="1.5">PLUS FOUR SIGNALS YOU CAN GET A RETURN FROM AI RIGHT NOW</text><rect x="40" y="334" width="196" height="140" fill="#fff" stroke="#d8ded0"/><rect x="40" y="334" width="196" height="5" fill="#92ad39"/><text x="54" y="366" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">10+ hours a week</text><text x="54" y="390" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">One repeatable task eats</text><text x="54" y="407" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">ten or more hours. Roughly</text><text x="54" y="424" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">where automation pays back</text><text x="54" y="441" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">within a year.</text><rect x="247" y="334" width="196" height="140" fill="#fff" stroke="#d8ded0"/><rect x="247" y="334" width="196" height="5" fill="#92ad39"/><text x="261" y="366" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">Unused data piling up</text><text x="261" y="390" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">Years of quotes, support</text><text x="261" y="407" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">emails and job history</text><text x="261" y="424" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">sitting in structured</text><text x="261" y="441" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">systems.</text><rect x="454" y="334" width="196" height="140" fill="#fff" stroke="#d8ded0"/><rect x="454" y="334" width="196" height="5" fill="#92ad39"/><text x="468" y="366" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">Stable, connectable tools</text><text x="468" y="390" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">CRM, Xero or MYOB and a</text><text x="468" y="407" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">booking platform that each</text><text x="468" y="424" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">offer an export or API.</text><rect x="661" y="334" width="196" height="140" fill="#fff" stroke="#d8ded0"/><rect x="661" y="334" width="196" height="5" fill="#92ad39"/><text x="675" y="366" font-size="13.5" fill="#1d2720" font-weight="700" text-anchor="start">A senior decision-maker</text><text x="675" y="390" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">One owner or manager with</text><text x="675" y="407" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">budget authority and a</text><text x="675" y="424" font-size="11.5" fill="#657067" font-weight="400" text-anchor="start">named project lead.</text></svg>