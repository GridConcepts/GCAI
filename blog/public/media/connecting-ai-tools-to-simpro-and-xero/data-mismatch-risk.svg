<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t3 d3" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="t3">Connecting two systems moves a data mismatch faster - it does not fix it</title>
<desc id="d3">A comparison flow showing that connecting ActionStep and Keap without first checking client records just moves a mismatch like "J. Smith" versus "John Smith" faster, while pulling ten recent client records and fixing mismatches first means automation runs on records that agree.</desc>
<rect width="900" height="390" fill="#f9faf5" stroke="#d8ded0"/>
<text x="40" y="36" font-family="Lora, Georgia, serif" font-size="22" font-weight="600" fill="#1d2720">Connecting systems moves a mismatch faster</text>
<text x="40" y="58" font-size="13" fill="#657067">It does not fix one that was already there</text>

<text x="30" y="80" font-size="13" fill="#657067" font-weight="600">If you connect first</text>
<rect x="30" y="90" width="250" height="90" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="155" y="128" text-anchor="middle" font-size="13" fill="#1d2720">ActionStep: "J. Smith"</text>
<text x="155" y="148" text-anchor="middle" font-size="13" fill="#1d2720">Keap: "John Smith"</text>

<rect x="325" y="90" width="250" height="90" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="450" y="135" text-anchor="middle" font-size="14" fill="#1d2720" font-weight="600">Connect without</text>
<text x="450" y="156" text-anchor="middle" font-size="14" fill="#1d2720" font-weight="600">checking records</text>

<rect x="620" y="90" width="250" height="90" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="745" y="128" text-anchor="middle" font-size="13" fill="#1d2720">Mismatch moves faster -</text>
<text x="745" y="148" text-anchor="middle" font-size="13" fill="#1d2720">now visible everywhere</text>

<line x1="280" y1="135" x2="323" y2="135" stroke="#92ad39" stroke-width="2"/>
<path d="M 323 135 L 313 130 L 313 140 Z" fill="#92ad39"/>
<line x1="575" y1="135" x2="618" y2="135" stroke="#92ad39" stroke-width="2"/>
<path d="M 618 135 L 608 130 L 608 140 Z" fill="#92ad39"/>

<text x="30" y="240" font-size="13" fill="#657067" font-weight="600">If you check first</text>
<rect x="30" y="250" width="250" height="90" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="155" y="288" text-anchor="middle" font-size="13" fill="#1d2720">Pull ten recent client</text>
<text x="155" y="308" text-anchor="middle" font-size="13" fill="#1d2720">records and compare</text>

<rect x="325" y="250" width="250" height="90" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="450" y="288" text-anchor="middle" font-size="14" fill="#1d2720" font-weight="600">Fix mismatches</text>
<text x="450" y="309" text-anchor="middle" font-size="14" fill="#1d2720" font-weight="600">before connecting</text>

<rect x="620" y="250" width="250" height="90" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="745" y="288" text-anchor="middle" font-size="13" fill="#1d2720">Automation runs on</text>
<text x="745" y="308" text-anchor="middle" font-size="13" fill="#1d2720">records that agree</text>

<line x1="280" y1="295" x2="323" y2="295" stroke="#92ad39" stroke-width="2"/>
<path d="M 323 295 L 313 290 L 313 300 Z" fill="#92ad39"/>
<line x1="575" y1="295" x2="618" y2="295" stroke="#92ad39" stroke-width="2"/>
<path d="M 618 295 L 608 290 L 608 300 Z" fill="#92ad39"/>
</svg>
