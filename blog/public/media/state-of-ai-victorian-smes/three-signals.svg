<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 375" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Three readiness signals</title><desc id="d">Three readiness signals for Victorian SMEs: data foundations, systems integration and people readiness. When weak, AI projects become demos; when strong, AI becomes useful work.</desc><rect width="900" height="375" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Three readiness signals</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Ambition is not the bottleneck. Foundations are.</text><rect x="40.0" y="110" width="262.6666666666667" height="160" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="40.0" y="110" width="262.6666666666667" height="5" fill="#92ad39"/><text x="56.0" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="56.0" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Data foundations</text><text x="56.0" y="200.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Can teams trust the information</text><text x="56.0" y="217.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">they use every day?</text><rect x="318.6666666666667" y="110" width="262.6666666666667" height="160" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="318.6666666666667" y="110" width="262.6666666666667" height="5" fill="#92ad39"/><text x="334.6666666666667" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="334.6666666666667" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">Systems integration</text><text x="334.6666666666667" y="200.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Do CRM, marketing, sales and</text><text x="334.6666666666667" y="217.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">service tools share one customer</text><text x="334.6666666666667" y="233.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">picture?</text><rect x="597.3333333333334" y="110" width="262.6666666666667" height="160" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/><rect x="597.3333333333334" y="110" width="262.6666666666667" height="5" fill="#92ad39"/><text x="613.3333333333334" y="148" font-size="26" fill="#53661c" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="613.3333333333334" y="176.0" font-size="14" fill="#1d2720" font-weight="700" text-anchor="start">People readiness</text><text x="613.3333333333334" y="200.2" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Is there enough training and</text><text x="613.3333333333334" y="217.0" font-size="12" fill="#657067" font-weight="400" text-anchor="start">safe-use guidance for change to</text><text x="613.3333333333334" y="233.79999999999998" font-size="12" fill="#657067" font-weight="400" text-anchor="start">stick?</text><rect x="40" y="292" width="402" height="56" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="241" y="326" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Weak foundations: AI projects become demos</text><rect x="458" y="292" width="402" height="56" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="659" y="326" font-size="13" fill="#1d2720" font-weight="700" text-anchor="middle">Strong foundations: AI becomes useful work</text></svg>