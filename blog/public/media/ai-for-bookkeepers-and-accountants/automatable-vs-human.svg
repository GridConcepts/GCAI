<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Automatable now vs still human</title><desc id="d">Bank reconciliation, transaction categorisation, invoice and receipt matching and data entry are automatable now. Classification judgement, client conversations, lodgements and tax positions, and spotting new problems still need a person.</desc><rect width="900" height="360" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Automatable now vs still human</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Rules-based, high-volume work versus judgement and sign-off</text><rect x="40.0" y="110" width="402.0" height="220" fill="#f1f5e2" stroke="#92ad39" stroke-width="1"/><text x="56.0" y="138" font-size="13" fill="#53661c" font-weight="700" text-anchor="start" letter-spacing="1">AUTOMATABLE NOW</text><text x="76.0" y="172" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Bank reconciliation</text><path d="M57.0 168 l4 4 l8 -9" stroke="#53661c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="76.0" y="216" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Transaction categorisation</text><path d="M57.0 212 l4 4 l8 -9" stroke="#53661c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="76.0" y="260" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Invoice and receipt matching</text><path d="M57.0 256 l4 4 l8 -9" stroke="#53661c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="76.0" y="304" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Data entry from source documents</text><path d="M57.0 300 l4 4 l8 -9" stroke="#53661c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="458.0" y="110" width="402.0" height="220" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/><text x="474.0" y="138" font-size="13" fill="#9a7442" font-weight="700" text-anchor="start" letter-spacing="1">STILL NEEDS A PERSON</text><text x="494.0" y="172" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Judgement calls on classification</text><path d="M476.0 162 l9 9 M485.0 162 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="494.0" y="216" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Client conversations</text><path d="M476.0 206 l9 9 M485.0 206 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="494.0" y="260" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Lodgements and tax positions</text><path d="M476.0 250 l9 9 M485.0 250 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/><text x="494.0" y="304" font-size="12.5" fill="#1d2720" font-weight="400" text-anchor="start">Spotting a genuinely new problem</text><path d="M476.0 294 l9 9 M485.0 294 l-9 9" stroke="#c8a27a" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>