<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">AI adoption in Asia-Pacific accounting and finance roles</title><desc id="d">Per CPA Australia's Business Technology Survey, AI adoption across Asia-Pacific accounting and finance roles rose from 69% the year before to 89% in the past year.</desc><rect width="900" height="260" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">AI adoption in APAC accounting and finance</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Source: CPA Australia Business Technology Survey</text><text x="40" y="122" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Previous year</text><text x="860" y="124" font-size="16" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">69%</text><rect x="40" y="132" width="820" height="14" fill="#e9ede0"/><rect x="40" y="132" width="565.8" height="14" fill="#c8a27a"/><text x="40" y="184" font-size="13.5" fill="#1d2720" font-weight="600" text-anchor="start">Past year</text><text x="860" y="186" font-size="16" fill="#1d2720" font-weight="700" text-anchor="end" font-family="Lora, Georgia, serif">89%</text><rect x="40" y="194" width="820" height="14" fill="#e9ede0"/><rect x="40" y="194" width="729.8" height="14" fill="#92ad39"/></svg>