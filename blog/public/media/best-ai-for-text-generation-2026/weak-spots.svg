<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Where AI text generation still struggles</title><desc id="d">Keyword insertion is the most serious problem, then meta tags, then tables.</desc><rect width="900" height="420" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">Where AI text generation still struggles</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">Ranked from the most serious problem to the least significant</text><rect x="40" y="108" width="820" height="80" fill="#fff" stroke="#d8ded0"/><rect x="40" y="108" width="8" height="80" fill="#c8a27a"/><text x="70" y="142" font-size="26" fill="#9a7442" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">1</text><text x="110" y="138" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Inserting keywords</text><text x="110" y="158" font-size="12" fill="#657067" font-weight="400" text-anchor="start">No AI passed. With 20-30 keywords, some 4-5 words long, you must spell out</text><text x="110" y="174" font-size="12" fill="#657067" font-weight="400" text-anchor="start">exactly how flexibly each one can be used.</text><rect x="700" y="130" width="140" height="8" fill="#faf3ea"/><rect x="700" y="130" width="140.0" height="8" fill="#c8a27a"/><text x="700" y="158" font-size="11" fill="#9a7442" font-weight="600" text-anchor="start">Most serious</text><rect x="40" y="200" width="820" height="80" fill="#fff" stroke="#d8ded0"/><rect x="40" y="200" width="8" height="80" fill="#c8a27a"/><text x="70" y="234" font-size="26" fill="#9a7442" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">2</text><text x="110" y="230" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Creating meta tags</text><text x="110" y="250" font-size="12" fill="#657067" font-weight="400" text-anchor="start">No AI passed. Descriptions drift past 170 characters or are not unique,</text><text x="110" y="266" font-size="12" fill="#657067" font-weight="400" text-anchor="start">so a human pass is still needed.</text><rect x="700" y="222" width="140" height="8" fill="#faf3ea"/><rect x="700" y="222" width="98.0" height="8" fill="#c8a27a"/><text x="700" y="250" font-size="11" fill="#9a7442" font-weight="600" text-anchor="start">Serious</text><rect x="40" y="292" width="820" height="80" fill="#fff" stroke="#d8ded0"/><rect x="40" y="292" width="8" height="80" fill="#c8a27a"/><text x="70" y="326" font-size="26" fill="#9a7442" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">3</text><text x="110" y="322" font-size="16" fill="#1d2720" font-weight="700" text-anchor="start">Building tables</text><text x="110" y="342" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Results were mixed. AI oversimplifies tables on abstract topics</text><text x="110" y="358" font-size="12" fill="#657067" font-weight="400" text-anchor="start">rather than clean numeric data.</text><rect x="700" y="314" width="140" height="8" fill="#faf3ea"/><rect x="700" y="314" width="56.0" height="8" fill="#c8a27a"/><text x="700" y="342" font-size="11" fill="#9a7442" font-weight="600" text-anchor="start">Least serious</text></svg>