<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif"><title id="t">Most common tasks for each AI tool</title><desc id="d">Claude: coding, data analysis, text creation. Gemini: text creation, seeking information, brainstorming. Copilot: text creation, text revising, slide creation. DeepSeek: coding, math and reasoning, general productivity. ChatGPT: practical guidance, seeking information, text creation.</desc><rect width="900" height="430" fill="#f9faf5" stroke="#d8ded0"/><text x="40" y="54" font-size="22" fill="#1d2720" font-weight="600" text-anchor="start" font-family="Lora, Georgia, serif">What each AI is mostly used for</text><text x="40" y="80" font-size="13" fill="#657067" font-weight="400" text-anchor="start">ChatGPT's top use is practical guidance. Text creation is only third.</text><text x="250" y="116" font-size="11" fill="#657067" font-weight="600" text-anchor="start" letter-spacing="1.5">MOST COMMON</text><text x="480" y="116" font-size="11" fill="#657067" font-weight="600" text-anchor="start" letter-spacing="1.5">2ND</text><text x="690" y="116" font-size="11" fill="#657067" font-weight="600" text-anchor="start" letter-spacing="1.5">3RD</text><line x1="40" y1="128" x2="860" y2="128" stroke="#d8ded0"/><text x="40" y="162" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Claude</text><rect x="240" y="138" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="250" y="160" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Coding</text><rect x="470" y="138" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="480" y="160" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Data analysis</text><rect x="680" y="138" width="190" height="34" fill="#92ad39" stroke="#92ad39"/><text x="690" y="160" font-size="12.5" fill="#fff" font-weight="600" text-anchor="start">Text creation</text><line x1="40" y1="186" x2="860" y2="186" stroke="#d8ded0"/><text x="40" y="220" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Gemini</text><rect x="240" y="196" width="190" height="34" fill="#92ad39" stroke="#92ad39"/><text x="250" y="218" font-size="12.5" fill="#fff" font-weight="600" text-anchor="start">Text creation</text><rect x="470" y="196" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="480" y="218" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Seeking information</text><rect x="680" y="196" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="690" y="218" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Brainstorming</text><line x1="40" y1="244" x2="860" y2="244" stroke="#d8ded0"/><text x="40" y="278" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">Copilot</text><rect x="240" y="254" width="190" height="34" fill="#92ad39" stroke="#92ad39"/><text x="250" y="276" font-size="12.5" fill="#fff" font-weight="600" text-anchor="start">Text creation</text><rect x="470" y="254" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="480" y="276" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Text revising</text><rect x="680" y="254" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="690" y="276" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Slide creation</text><line x1="40" y1="302" x2="860" y2="302" stroke="#d8ded0"/><text x="40" y="336" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">DeepSeek</text><rect x="240" y="312" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="250" y="334" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Coding</text><rect x="470" y="312" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="480" y="334" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Math and reasoning</text><rect x="680" y="312" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="690" y="334" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">General productivity</text><line x1="40" y1="360" x2="860" y2="360" stroke="#d8ded0"/><text x="40" y="394" font-size="15" fill="#1d2720" font-weight="700" text-anchor="start">ChatGPT</text><rect x="240" y="370" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="250" y="392" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Practical guidance</text><rect x="470" y="370" width="190" height="34" fill="#fff" stroke="#d8ded0"/><text x="480" y="392" font-size="12.5" fill="#1d2720" font-weight="500" text-anchor="start">Seeking information</text><rect x="680" y="370" width="190" height="34" fill="#92ad39" stroke="#92ad39"/><text x="690" y="392" font-size="12.5" fill="#fff" font-weight="600" text-anchor="start">Text creation</text><line x1="40" y1="418" x2="860" y2="418" stroke="#d8ded0"/><rect x="40" y="396" width="22" height="16" fill="#92ad39"/><text x="70" y="409" font-size="12" fill="#657067" font-weight="400" text-anchor="start">Text creation</text></svg>