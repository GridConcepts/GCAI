<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
<title id="t">How the 2026 AI text generation test was structured</title>
<desc id="d">Flow diagram showing the same identical prompt, covering six tasks (writing 7k characters from scratch, analysing and parsing a client page, building a table, inserting native hyperlinks, inserting keywords, and producing meta tags), was fed to all five AI tools so the results could be scored side by side.</desc>
<rect width="900" height="320" fill="#f9faf5" stroke="#d8ded0"/>

<text x="30" y="42" font-family="Lora, Georgia, serif" font-weight="600" font-size="22" fill="#1d2720">How the test was structured</text>
<text x="30" y="64" font-size="13" fill="#657067">One identical prompt, six tasks, five AI tools</text>

<!-- Box 1 -->
<rect x="40" y="100" width="190" height="130" rx="6" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="135" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2720">1 identical prompt</text>
<text x="135" y="152" text-anchor="middle" font-size="11" fill="#657067">Same wording fed to</text>
<text x="135" y="168" text-anchor="middle" font-size="11" fill="#657067">every AI, in a new chat,</text>
<text x="135" y="184" text-anchor="middle" font-size="11" fill="#657067">on a permanent paid</text>
<text x="135" y="200" text-anchor="middle" font-size="11" fill="#657067">account (where available)</text>

<!-- Arrow 1 -->
<line x1="230" y1="165" x2="282" y2="165" stroke="#92ad39" stroke-width="2"/>
<path d="M 282 165 L 270 159 L 270 171 Z" fill="#92ad39"/>

<!-- Box 2: highlighted, the 6 tasks -->
<rect x="285" y="90" width="330" height="200" rx="6" fill="#faf3ea" stroke="#c8a27a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="450" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2720">6 tasks in the prompt</text>
<text x="310" y="140" font-size="12" fill="#1d2720">1. Write 7k characters from scratch</text>
<text x="310" y="161" font-size="12" fill="#1d2720">2. Analyse and parse a client page</text>
<text x="310" y="182" font-size="12" fill="#1d2720">3. Build a table</text>
<text x="310" y="203" font-size="12" fill="#1d2720">4. Insert native hyperlinks</text>
<text x="310" y="224" font-size="12" fill="#1d2720">5. Insert keywords</text>
<text x="310" y="245" font-size="12" fill="#1d2720">6. Produce meta tags</text>

<!-- Arrow 2 -->
<line x1="615" y1="165" x2="667" y2="165" stroke="#92ad39" stroke-width="2"/>
<path d="M 667 165 L 655 159 L 655 171 Z" fill="#92ad39"/>

<!-- Box 3 -->
<rect x="670" y="100" width="190" height="130" rx="6" fill="#ffffff" stroke="#d8ded0" stroke-width="1"/>
<text x="765" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2720">5 AI tools</text>
<text x="765" y="152" text-anchor="middle" font-size="11" fill="#657067">ChatGPT, Claude,</text>
<text x="765" y="168" text-anchor="middle" font-size="11" fill="#657067">Gemini, Copilot</text>
<text x="765" y="184" text-anchor="middle" font-size="11" fill="#657067">and DeepSeek,</text>
<text x="765" y="200" text-anchor="middle" font-size="11" fill="#657067">scored side by side</text>

<text x="30" y="300" font-size="12" fill="#657067">Source: Grid Concepts internal test, 2026</text>
</svg>
